<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海参的小窝</title>

<!-- 字体：Noto Sans SC（思源黑体），有 400 / 700 / 900 三种粗细。
     联网时自动加载；加载不到就用下面 CSS 里写的备用字体，不会坏。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">

<!--
  ============================================================
  文件结构（从上到下）：
    1. <style>   —— 外观：颜色、黑色磨砂玻璃、鼠标聚光、动画
    2. <body>    —— 页面里有哪些模块：
                      ① 个人信息   ② 时间 + 日历   ③ 常用网站   ④ 底部搜索栏
    3. <script>  —— 逻辑：每日金句、时钟、日历、网站图标、鼠标聚光

  你最常改的地方，我都用【改这里】标出来了：
    - 背景图文件名（style 里）
    - 头像文件名（body 里）
    - 网站列表（script 最上面）
  ============================================================
-->

<style>
  /* ---------- 1. 全局变量：配色、模糊、圆角都在这里调 ---------- */
  :root {
    /* 黑色磨砂玻璃：底色是半透明的黑。第四个数字是透明度，越大越黑越不透 */
    --glass-bg: rgba(12, 12, 16, 0.55);
    --glass-border: rgba(255, 255, 255, 0.10);   /* 边缘的细线 */
    --glass-blur: 24px;                          /* 磨砂程度 */
    --glass-shadow: 0 18px 50px rgba(0, 0, 0, 0.40);

    --text: #f4f4f6;
    --text-soft: rgba(244, 244, 246, 0.62);

    --radius: 28px;                              /* 大模块的圆角 */
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);      /* 动画手感：先快后慢 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    background: #0a0b12;      /* 图片没加载出来时的保底色 */
    min-height: 100vh;
    display: flex;            /* 上下排：主内容在上，署名在最下；内容不够高时，署名也会沉到屏幕底部 */
    flex-direction: column;
  }

  /* ---------- 2. 固定背景图层 ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;

    /* 【改这里】把 bg.jpg 换成你上传的背景图文件名。
       两层从上到下：①你的图片 ②保底渐变。
       （压暗层现在是下面单独的 .bg::after，这样清爽模式可以把它调淡） */
    background:
      url("bg.jpg") center / cover no-repeat,
      linear-gradient(135deg, #141a3d 0%, #3b2a66 55%, #7a3b66 100%);

    /* 打开页面时：背景先放大+模糊，再慢慢对焦（见 .ready） */
    transform: scale(1.08);
    filter: blur(18px);
    transition: transform 1.6s var(--ease), filter 1.6s var(--ease);
  }
  body.ready .bg { transform: scale(1); filter: blur(0); }

  /* 压暗层：盖在壁纸上的一层半透明黑，让文字更清楚。
     清爽模式下它会淡到很浅（opacity 0.25），壁纸就更亮、更好看 */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(5, 6, 12, 0.35), rgba(5, 6, 12, 0.65));
    transition: opacity 0.9s var(--ease);
  }
  body.clean .bg::after { opacity: 0.25; }

  /* ---------- 3. 黑色磨砂玻璃 ----------
     class="glass" 就是玻璃。核心是 backdrop-filter：把元素"背后的画面"模糊掉。 */
  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    border-radius: var(--radius);
  }

  /* ---------- 4. 鼠标聚光（交互高亮）----------
     class="spot" 的元素会有两层效果：
       ::before  —— 鼠标周围一团柔和的光（在内容后面）
       ::after   —— 鼠标附近的边框会被点亮
     光的位置由 script 把鼠标坐标写进 --mx / --my 两个变量来控制。 */
  .spot {
    position: relative;
    isolation: isolate;       /* 让 ::before 能垫在内容后面、背景前面 */
    --mx: 50%;
    --my: 50%;
  }
  .spot::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    z-index: -1;
    background: radial-gradient(320px circle at var(--mx) var(--my),
                rgba(255, 255, 255, 0.13), transparent 65%);
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }
  .spot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;             /* 这 1px 就是被点亮的"边框"的粗细 */
    background: radial-gradient(240px circle at var(--mx) var(--my),
                rgba(255, 255, 255, 0.55), transparent 65%);
    /* 下面两行是个小技巧：只保留 1px 的边框形状，中间挖空 */
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }
  .spot:hover::before,
  .spot:hover::after { opacity: 1; }

  /* ---------- 5. 页面整体布局 ---------- */
  .page {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    flex: 1 0 auto;                  /* 占满 body 里剩下的高度，把下面的署名顶到最底部 */
    align-content: start;            /* 模块仍然从上往下紧挨着排，多出来的高度是留白 */
    padding: 48px 24px 24px;
    display: grid;
    gap: 22px;
    grid-template-columns: repeat(12, 1fr);   /* 12 列：每个模块占几列，就是它的宽度（5+7 / 8+4 / 12） */
  }
  .profile  { grid-column: span 5; }   /* 第一行：个人信息占 5 列 */
  /* 第一行两个模块的高度是"固定"的（不再由内容撑开）：
     这样不管一言随机到多长的句子、日程写了几行，模块的大小都不会变，页面也不会跟着抖。
     想再高一点/矮一点，改这个数字（两个模块要一起改，才能保持一样高）。 */
  .profile, .clockcal { height: 380px; }
  .clockcal { grid-column: span 7; }   /*          时间日历占 7 列 */
  .weather  { grid-column: span 8; }   /* 第二行：天气占 8 列 = 左边 2/3 */
  .folder   { grid-column: span 4; }   /*          网站文件夹占 4 列 = 右边 1/3 */
  .site-panel { grid-column: 1 / -1; } /* 其他整行模块（比如文件传输助手）占满 12 列 */

  /* ---------- 6. 模块①：个人信息 ---------- */
  .profile {
    padding: 28px;
    display: flex;
    flex-direction: column;     /* 上下排：上面是头像+欢迎，下面是今日日程 */
    justify-content: space-between;   /* 固定高度后：头像区贴上，日程区贴下，句子长短只会改变中间的空白 */
    gap: 24px;
  }
  .profile-top {
    display: flex;
    gap: 22px;
    align-items: flex-start;
  }
  .avatar {
    position: relative;
    flex: none;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    font-size: 40px;
    font-weight: 900;
    background: linear-gradient(135deg, #7c8cff, #c46bff);   /* 没头像时的渐变底 */
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.14), 0 10px 28px rgba(0, 0, 0, 0.4);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .profile h1 {
    font-size: clamp(30px, 3.6vw, 42px);
    font-weight: 900;               /* 最粗一档，标题更有设计感 */
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .quote {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-soft);
    cursor: pointer;
    transition: opacity 0.3s, transform 0.3s var(--ease);
  }
  .quote.swap { opacity: 0; transform: translateY(6px); }   /* 换句子时的淡出 */
  .quote small { display: block; margin-top: 6px; font-size: 13px; opacity: 0.8;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 出处：只占 1 行，太长用 … */
  .profile-top > div:last-child { flex: 1; min-width: 0; }   /* min-width:0 才能让上面的省略号生效 */
  #quote-text {                    /* 句子：最多 3 行，超出的部分用 … 收起来 */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------- 6.5 今日日程 ----------
     两个状态叠在同一个位置（grid-area: 1/1）：
       .todo-ask  —— 还没写：提示 + 输入框
       .todo-done —— 写好了：标题 + 大字内容
     给 .todo 加上 "done" 这个 class，就会从"ask"淡出、"done"淡入。 */
  .todo {
    display: grid;
    padding-top: 22px;
    border-top: 1px solid var(--glass-border);   /* 和上面分隔的细线 */
  }
  .todo > * {
    grid-area: 1 / 1;                            /* 两块叠在一起 */
    transition: opacity 0.45s var(--ease), translate 0.45s var(--ease);
  }

  /* 状态一：提示 + 输入框。提示字号约为标题（42px）的一半 */
  .todo-ask-title {
    font-size: clamp(15px, 1.8vw, 21px);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .todo-ask input {
    width: 100%;
    padding: 13px 18px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    outline: none;                                /* 去掉默认边框，用下面的光圈代替 */
    transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
  }
  .todo-ask input::placeholder { color: var(--text-soft); }
  .todo-ask input:focus {
    background: rgba(255, 255, 255, 0.10);
    border-color: rgba(255, 255, 255, 0.30);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.10);
  }

  /* 状态二：写好之后。一开始是隐藏的 */
  .todo-done {
    opacity: 0;
    visibility: hidden;
    translate: 0 8px;
    /* visibility 要等淡出播完（0.45s）才真正隐藏，否则会瞬间消失、看不到淡出 */
    transition: opacity 0.45s var(--ease), translate 0.45s var(--ease), visibility 0s 0.45s;
  }
  .todo-done-label { font-size: 14px; color: var(--text-soft); margin-bottom: 8px; }
  .todo-done-text {
    font-size: 22px;            /* 和右边"星期几"的字号一致 */
    font-weight: 900;
    line-height: 1.4;
    overflow-wrap: anywhere;    /* 写得很长时自动换行 */
  }

  /* 切换：ask 淡出（并上移一点），done 稍等一下再淡入 */
  .todo.done .todo-ask {
    opacity: 0;
    translate: 0 -8px;
    visibility: hidden;
    transition: opacity 0.4s var(--ease), translate 0.4s var(--ease), visibility 0s 0.4s;
  }
  .todo.done .todo-done {
    opacity: 1;
    visibility: visible;
    translate: 0 0;
    transition: opacity 0.45s var(--ease) 0.35s, translate 0.45s var(--ease) 0.35s, visibility 0s 0.35s;
  }
  /* 完成后回到输入状态时：先等"今天要做的事"淡出（约0.35s），输入框再淡入 */
  .todo:not(.done) .todo-ask { transition-delay: 0.35s; }

  /* 勾选框 + 文字排成一行 */
  .todo-item { display: flex; gap: 14px; align-items: flex-start; }

  /* 勾选框：默认是空心的圆角方框 */
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    margin-top: 3px;                 /* 对齐第一行文字的中线 */
    padding: 0;
    display: grid;
    place-items: center;
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.55);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s var(--ease);
  }
  .check:hover { background: rgba(255, 255, 255, 0.12); transform: scale(1.08); }
  .check:active { transform: scale(0.94); }
  .check:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* 里面的"勾"：用描边动画一笔画出来
     pathLength="1" 把路径总长当作 1，所以 dasharray / dashoffset 用 1 就是"整条线" */
  .check svg { width: 18px; height: 18px; fill: none; stroke: #0c0c10; stroke-width: 3;
               stroke-linecap: round; stroke-linejoin: round; }
  .check path {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;            /* 1 = 整条线都藏起来 */
    transition: stroke-dashoffset 0.35s var(--ease) 0.1s;
  }

  /* 被点击后（completing）：方框变成实心白色，勾被画出来；并且不能再点 */
  .todo.completing .check {
    background: #fff;
    border-color: #fff;
    box-shadow: 0 0 16px rgba(255, 255, 255, 0.45);
    pointer-events: none;
  }
  .todo.completing .check path { stroke-dashoffset: 0; }   /* 0 = 整条线显示出来 */

  /* 划线动画：用一条 2.5px 高的渐变线当"删除线"，宽度从 0% 拉到 100%。
     文字同时变暗。这个类加在文字外层的 <span class="strike"> 上 */
  .strike {
    background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 0% 2.5px;
    transition: background-size 0.6s var(--ease), color 0.6s;
  }
  .todo.striking .strike {
    background-size: 100% 2.5px;
    color: var(--text-soft);
  }

  /* ---------- 7. 模块②：时间 + 日历（左右各一半） ---------- */
  .clockcal {
    padding: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  .clock { display: flex; flex-direction: column; justify-content: center; }
  .time {
    font-size: clamp(54px, 7vw, 84px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;   /* 数字等宽，不会跳动 */
  }
  .time .sec { font-size: 0.34em; font-weight: 700; color: var(--text-soft); margin-left: 6px; letter-spacing: 0; }
  .weekday { margin-top: 14px; font-size: 22px; font-weight: 900; }
  .fulldate { margin-top: 4px; font-size: 15px; color: var(--text-soft); }

  .calendar { padding-left: 28px; border-left: 1px solid var(--glass-border); display: flex; flex-direction: column; justify-content: center; }  /* 左边一条分隔线 */
  .cal-title { font-size: 18px; font-weight: 900; margin-bottom: 12px; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);   /* 一周 7 列 */
    gap: 4px 0;
    text-align: center;
    font-size: 14px;
  }
  .cal-grid .wd { font-size: 12px; color: var(--text-soft); padding-bottom: 6px; }
  .cal-grid .day {
    height: 32px;
    width: 32px;
    margin: 0 auto;
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: background 0.25s;
  }
  .cal-grid .day:hover { background: rgba(255, 255, 255, 0.12); }
  /* 今天：白色实心圆 + 光晕，一眼就能看到 */
  .cal-grid .day.today {
    background: #fff;
    color: #0c0c10;
    font-weight: 900;
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.55);
  }

  /* ---------- 8. 模块③：常用网站 ---------- */
  .site-panel { padding: 26px 28px 30px; }
  .panel-title { font-size: 18px; font-weight: 900; margin-bottom: 18px; }
  .sites {
    display: grid;
    /* 自动排列：每个图标至少 120px 宽，放不下就换行。屏幕够宽时 7 个正好一行 */
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 14px;
  }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 8px 16px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
    transition: transform 0.45s var(--ease), background 0.3s;
  }
  .tile:hover { transform: translateY(-6px); background: rgba(255, 255, 255, 0.08); }
  .tile:active { transform: translateY(-1px) scale(0.97); transition-duration: 0.1s; }  /* 按下去轻轻一缩 */
  .tile:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }   /* 键盘 Tab 选中时可见 */

  .icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 900;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .tile .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 9. 模块④：底部搜索栏（平时藏着，需要时才出现） ----------
     出现的三种情况（和右侧侧边栏是同一个思路）：
       ① 鼠标移到屏幕底部 —— JS 给它加上 .near
       ② 按 "/" 键 —— 输入框获得焦点，:focus-within 生效
       ③ 里面已经有文字 —— JS 给它加上 .has-text
     它在最上层（z-index 140），比"输入时的模糊层"（135）还高，所以模糊时只有它是清晰的。 */
  .searchbar {
    position: fixed;                 /* fixed = 固定在屏幕上，页面怎么滚它都不动 */
    left: 50%;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    z-index: 140;                    /* 数字越大越在上面；比其他所有东西（包括模糊层）都大 */
    width: min(620px, 90vw);
    height: 58px;
    padding: 0 22px;
    border-radius: 999px;            /* 胶囊形 */
    display: flex;
    align-items: center;
    gap: 12px;
    transform: translateX(-50%);     /* 配合 left:50% 做水平居中 */
    opacity: 0;                      /* 平时完全透明 */
    translate: 0 16px;               /* 并且往下沉一点，出现时再升起来 */
    pointer-events: none;            /* 藏着的时候不挡住后面的东西 */
    transition: width 0.5s var(--ease), box-shadow 0.35s, background 0.35s,
                opacity 0.4s var(--ease), translate 0.4s var(--ease);
  }
  .searchbar.near,
  .searchbar:focus-within,
  .searchbar.has-text {
    opacity: 1;
    translate: 0 0;
    pointer-events: auto;
  }
  /* 点进搜索框：变宽 + 外面一圈光 */
  .searchbar:focus-within {
    width: min(740px, 94vw);
    background: rgba(8, 8, 12, 0.72);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 4px rgba(255, 255, 255, 0.14);
  }
  .searchbar svg { width: 20px; height: 20px; flex: none; opacity: 0.75; }
  .searchbar input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;                   /* 去掉默认丑边框，用上面的光圈代替 */
    color: var(--text);
    font: inherit;
    font-size: 17px;
  }
  .searchbar input::placeholder { color: var(--text-soft); }

  /* ---------- 9.6b 搜索时的整屏模糊 ----------
     搜索框一获得焦点（点进去，或者按 / 键），这一层就盖住整个屏幕，把它后面的一切
     （包括背景、模块、侧边栏、悬浮窗口）都模糊掉，只有搜索栏（更高的层级）保持清晰，
     效果和展开网站文件夹时一样。模糊程度是从 0 慢慢渐变上去的。
     平时它不挡鼠标；模糊时点它，会清空并收起搜索栏。 */
  .search-veil {
    position: fixed;
    inset: 0;
    z-index: 135;
    pointer-events: none;
    background: rgba(4, 5, 12, 0);
    -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
    transition: background 0.45s var(--ease), backdrop-filter 0.45s var(--ease), -webkit-backdrop-filter 0.45s var(--ease);
  }
  body.search-active .search-veil {
    pointer-events: auto;
    background: rgba(4, 5, 12, 0.45);
    -webkit-backdrop-filter: blur(24px) saturate(120%);
            backdrop-filter: blur(24px) saturate(120%);
  }

  /* ---------- 9.5 清爽模式 ----------
     JS 给 <body> 加上 class="clean" 就进入清爽模式。
     下面所有 body.clean 开头的规则，都是"清爽模式下才生效"。 */

  /* 所有模块：淡出（进入清爽模式）/ 淡入（回到启动界面）。
     【重要】淡入淡出是作用在"每个模块自己"身上的，而不是整个 .page 容器。
     原因：浏览器有一条规定——只要一个元素处于半透明状态（opacity 小于 1），
     它里面的磨砂玻璃（backdrop-filter）就看不到它后面的画面，磨砂会暂时失效，
     要等这个元素完全不透明了才突然出现。
     如果让整个 .page 淡入，所有模块的磨砂就都得等淡入播完才出现（之前的 bug 就是这样）。
     现在每个模块各自淡入，它们自己的磨砂从第一帧起就是有效的。
     visibility 要等淡出播完（0.6s）才隐藏，所以能看到淡出动画。
     （:not(.reveal)：页面刚打开时的入场动画用的是 .reveal，不去干扰它） */
  .page > :not(.reveal) {
    transition: opacity 0.6s var(--ease), visibility 0s, transform 0.45s var(--ease);   /* transform 是网站文件夹悬停上浮用的 */
  }
  body.clean .page > * {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.6s var(--ease), visibility 0s 0.6s, transform 0.45s var(--ease);
  }
  body.clean { overflow: hidden; }   /* 清爽模式下锁住滚动，退出后回到原来的位置 */

  /* 屏幕正上方的时钟：平时藏着，清爽模式下淡入。没有玻璃底，直接写在壁纸上 */
  .cclock {
    position: fixed;
    left: 0; right: 0;
    top: max(84px, 11vh);            /* 上面留一块地方给提示条 */
    z-index: 50;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    translate: 0 -10px;
    text-shadow: 0 3px 30px rgba(0, 0, 0, 0.55);   /* 柔和的影子，浅色壁纸上也看得清 */
    transition: opacity 0.5s var(--ease), translate 0.5s var(--ease), visibility 0s 0.5s;
  }
  body.clean .cclock {
    opacity: 1;
    visibility: visible;
    translate: 0 0;
    /* 等模块淡出一部分再淡入，衔接更自然 */
    transition: opacity 0.8s var(--ease) 0.35s, translate 0.8s var(--ease) 0.35s, visibility 0s 0s;
  }
  .ctime {
    font-size: clamp(64px, 10vw, 124px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .ctime .csec { font-size: 0.3em; font-weight: 700; margin-left: 8px; letter-spacing: 0; opacity: 0.75; }
  .cdate { margin-top: 12px; font-size: clamp(15px, 1.8vw, 19px); font-weight: 700; opacity: 0.8; }

  /* ---------- 9.5b 右侧侧边栏 ----------
     所有功能按钮统一放在这里，从上到下排列，最上面是切换清爽模式的 C 按钮。
     样式和各个模块一致（黑色磨砂玻璃 + 鼠标聚光）。
     平时透明；鼠标靠近它时 JS 给它加上 .near，它就会从右边滑进来。
     以后想加新功能：在 HTML 的 <aside id="corner"> 里再写一个 <button class="cbtn spot">，
     侧边栏会自己变长，"鼠标靠近"的判断也会自动跟着变。 */
  .corner {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);    /* 垂直居中。用 transform，这样不会和下面的 translate 动画冲突 */
    z-index: 110;
    padding: 8px;
    display: flex;
    flex-direction: column;         /* 竖着排：DOM 里先写的在上面 */
    gap: 8px;
    border-radius: 30px;
    opacity: 0;
    pointer-events: none;           /* 隐藏时不挡住后面的东西 */
    translate: 16px 0;              /* 藏起来时往右偏一点，浮现时滑进来 */
    transition: opacity 0.35s var(--ease), translate 0.35s var(--ease);
  }
  .corner.near,
  .corner:has(.cbtn:focus-visible) { opacity: 1; pointer-events: auto; translate: 0 0; }

  .cbtn {
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition: transform 0.3s var(--ease), background 0.25s, color 0.25s,
                height 0.4s var(--ease), margin 0.4s var(--ease), opacity 0.3s,
                border-width 0.4s, visibility 0s;
  }
  .cbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
              stroke-linecap: round; stroke-linejoin: round; }
  .cbtn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.12); }
  .cbtn:active { transform: scale(0.94); }
  .cbtn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .cbtn[aria-pressed="true"] { background: #fff; color: #0c0c10; }   /* C 按钮：清爽模式开着时变成白色实心 */
  .cbtn[aria-pressed="true"]:hover { background: #fff; }

  /* 音乐、番茄时钟、计算器、桌宠按钮：只在清爽模式下才出现。
     不是直接 display:none，而是把高度收成 0，这样进入清爽模式时侧边栏会平滑地"长出"一个按钮 */
  body:not(.clean) #music-btn,
  body:not(.clean) #pomo-btn,
  body:not(.clean) #calc-btn,
  body:not(.clean) #pet-btn {
    height: 0;
    margin-top: -8px;               /* 抵消掉它和上一个按钮之间的 8px 间距 */
    opacity: 0;
    border-width: 0;
    pointer-events: none;
    visibility: hidden;
    transition: height 0.4s var(--ease), margin 0.4s var(--ease), opacity 0.3s,
                border-width 0.4s, visibility 0s 0.4s;
  }

  /* ---------- 9.6 悬浮窗口（番茄时钟、计算器共用的"窗口外壳"） ----------
     class="win" 就是一个悬浮窗口：平时藏着，加上 .open 才出现。
     出现 / 消失的动画是"从侧边栏的按钮里长出来 / 收回按钮里去"：
       - 缩放的中心点（transform-origin）由 JS 在关闭那一刻算好，指向对应的侧边栏按钮；
       - 缩放用一条柔和的"先快后慢"曲线，透明度单独、略短地淡出，两者叠在一起就很顺；
       - will-change 提前告诉浏览器"这个要动"，让它单独做一层，动画不掉帧。
     定位靠 right / bottom；拖动时 JS 用 transform 偏移，不会改这些值。 */
  .win {
    position: fixed;
    z-index: 120;
    border-radius: 24px;
    cursor: grab;
    user-select: none;
    touch-action: none;           /* 触屏拖动时不触发页面滚动 */
    transform-origin: 100% 0%;    /* 默认朝右上角（侧边栏的方向），第一次关闭后由 JS 精确计算 */
    opacity: 0;
    visibility: hidden;
    scale: 0.55;
    translate: 0 6px;
    will-change: opacity, scale;
    /* 关闭：缩小 0.5 秒，透明度 0.32 秒淡出；visibility 等动画播完才真正隐藏 */
    transition: scale 0.5s cubic-bezier(0.32, 0.72, 0, 1),
                translate 0.5s cubic-bezier(0.32, 0.72, 0, 1),
                opacity 0.32s ease-out,
                visibility 0s 0.5s;
  }
  .win.open {
    opacity: 1;
    visibility: visible;
    scale: 1;
    translate: 0 0;
    transition: scale 0.5s cubic-bezier(0.32, 0.72, 0, 1),
                translate 0.5s cubic-bezier(0.32, 0.72, 0, 1),
                opacity 0.28s ease-out,
                visibility 0s 0s;
  }
  .win.dragging { cursor: grabbing; box-shadow: 0 28px 64px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1); }

  /* 番茄时钟窗口的位置和大小（停在侧边栏的左边） */
  .pomo { right: 220px; bottom: 28px; width: 264px; padding: 20px 22px 22px; }   /* 右边留出 200px 给桌宠 */

  .pomo-head { font-size: 14px; font-weight: 900; color: var(--text-soft); margin-bottom: 14px; }
  .pomo-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 28px; height: 28px;
    padding: 0;
    display: grid;
    place-items: center;
    color: var(--text-soft);
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
  }
  .pomo-close:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
  .pomo-close svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .pomo-close:focus-visible { outline: 2px solid #fff; }

  /* 窗口里两个状态叠在同一处（和日程的写法一样），用 data-phase 切换：
       idle = 输入分钟数   work = 专注倒计时   break = 休息倒计时 */
  .pomo-body { display: grid; }
  .pomo-body > * {
    grid-area: 1 / 1;
    transition: opacity 0.35s var(--ease), translate 0.35s var(--ease), visibility 0s;
  }
  .pomo[data-phase="idle"] .pomo-run,
  .pomo:not([data-phase="idle"]) .pomo-ask {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s var(--ease), translate 0.35s var(--ease), visibility 0s 0.35s;
  }
  .pomo[data-phase="idle"] .pomo-run { translate: 0 6px; }
  .pomo:not([data-phase="idle"]) .pomo-ask { translate: 0 -6px; }

  .pomo-sub { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .pomo-ask input {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    outline: none;
    cursor: text;
    user-select: text;
    transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
  }
  .pomo-ask input::placeholder { color: var(--text-soft); }
  .pomo-ask input:focus {
    background: rgba(255, 255, 255, 0.10);
    border-color: rgba(255, 255, 255, 0.30);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.10);
  }
  /* 输入不合法时，输入框左右抖一下 */
  @keyframes shake {
    20% { translate: -6px 0; }
    40% { translate: 5px 0; }
    60% { translate: -4px 0; }
    80% { translate: 2px 0; }
  }
  .pomo-ask input.shake { animation: shake 0.35s; }

  .pomo-phase { font-size: 14px; font-weight: 700; color: var(--text-soft); margin-bottom: 4px; }
  .pomo-time { font-size: 56px; font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .pomo-track { margin-top: 14px; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .pomo-fill { height: 100%; width: 0%; border-radius: 99px; background: #fff; transition: background 0.5s; }
  .pomo[data-phase="break"] .pomo-fill { background: #9be7c4; }   /* 休息时进度条变成淡绿色 */

  /* 屏幕正上方的提示条（"Claude提醒你该休息了"） */
  .toast {
    position: fixed;
    top: calc(22px + env(safe-area-inset-top, 0px));
    left: 50%;
    z-index: 130;
    padding: 13px 26px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;                /* 点一下可以关掉 */
    opacity: 0;
    visibility: hidden;
    translate: -50% -14px;
    transition: opacity 0.45s var(--ease), translate 0.45s var(--ease), visibility 0s 0.45s;
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    translate: -50% 0;
    transition: opacity 0.45s var(--ease), translate 0.45s var(--ease), visibility 0s 0s;
  }

  /* ---------- 9.7 窗口拖动 / 惯性滑行 ----------
     窗口用 transform 移动（显卡直接处理，不触发重新排版），拖动和滑行时保留完整的磨砂效果。
     如果在你的 Chromebook 上拖动时仍然觉得卡，可以把 --drag-blur 调小一点（比如 12px）：
     拖动时的模糊会弱一些，但会更流畅；松手停稳后恢复正常。 */
  :root { --drag-blur: var(--glass-blur); }   /* 拖动时的磨砂程度，默认和平时一样 */
  .glass.dragging,
  .glass.gliding {
    -webkit-backdrop-filter: blur(var(--drag-blur)) saturate(150%);
            backdrop-filter: blur(var(--drag-blur)) saturate(150%);
    will-change: transform, opacity, scale;
  }

  /* ---------- 9.8 番茄钟里的"停止计时"和"重新输入" ---------- */
  .pomo-time { transition: opacity 0.3s; }
  .pomo[data-paused="true"] .pomo-time { opacity: 0.5; }   /* 暂停时数字变暗，一眼能看出 */
  .pomo-actions { display: flex; gap: 10px; margin-top: 16px; }
  .pomo-act {
    flex: 1;
    padding: 9px 0;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.25s, transform 0.3s var(--ease);
  }
  .pomo-act:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }
  .pomo-act:active { transform: scale(0.97); }
  .pomo-act:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- 9.9 文件传输助手：页面里的入口模块 + 可拖动的窗口 ---------- */
  .ft-panel {
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .ft-panel .panel-title { margin-bottom: 6px; }
  .ft-desc { max-width: 520px; font-size: 14px; line-height: 1.6; color: var(--text-soft); }
  .ft-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  /* 胶囊按钮（以后别的模块也能用：class="pill"，想要更淡的加 ghost） */
  .pill {
    padding: 11px 22px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.25s, transform 0.35s var(--ease);
  }
  .pill.ghost { background: transparent; }
  .pill:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-2px); }
  .pill:active { transform: scale(0.97); }
  .pill:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* ---------- 9.10 计算器（清爽模式侧边栏里的第三个按钮） ---------- */
  .calc { left: 28px; bottom: 28px; width: 276px; padding: 20px; transform-origin: 0% 100%; }   /* 停在屏幕左下角，和停在右边的窗口互不遮挡 */
  .calc-screen {
    position: relative;              /* 给"飞行的算式"当定位基准 */
    overflow: hidden;                /* 飞行时超出屏幕的部分不显示 */
    margin-bottom: 14px;
    padding: 10px 14px 12px;
    min-height: 82px;
    text-align: right;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
  }
  .calc-expr {
    min-height: 18px;
    font-size: 13px;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .calc-out {
    margin-top: 4px;
    font-size: 38px;
    font-weight: 900;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    transform-origin: 100% 60%;      /* 结果出现时，以右边缘为中心放大 */
    transition: font-size 0.2s;
  }
  /* 计算动画里"飞行的算式"：由 JS 临时创建，飞到上方的算式行后就消失，换成真正的算式行 */
  .calc-ghost {
    position: absolute;
    right: 14px;                     /* 和屏幕的右内边距对齐 */
    width: max-content;
    font-size: 38px;                 /* 起点：和结果同样大 */
    font-weight: 900;
    line-height: 1.15;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transform-origin: 100% 50%;      /* 以右边缘为中心缩小，这样算式始终靠右 */
    pointer-events: none;
  }
  .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }   /* 4 列 6 行的按键网格 */
  .ck {
    height: 46px;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.25s var(--ease);
  }
  .ck:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
  .ck:active { transform: scale(0.95); }
  .ck:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .ck.fn { background: rgba(255, 255, 255, 0.12); font-size: 15px; }        /* AC ← √ x² */
  .ck.op { background: rgba(255, 255, 255, 0.16); font-size: 20px; }        /* + − × ÷ */
  .ck.op.active { background: #fff; color: #0c0c10; }                        /* 正在等你输入下一个数的运算符，会亮起来 */
  .ck.eq { grid-column: 1 / -1; background: #fff; color: #0c0c10; font-weight: 900; font-size: 20px; }   /* 等号：占满最下面一整行 */
  .ck.eq:hover { background: #e9e9ef; }

  /* ---------- 9.11 天气模块（左 2/3） ---------- */
  .weather {
    padding: 26px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .wx-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .wx-city { font-size: 18px; font-weight: 900; }
  .wx-sub { margin-top: 4px; font-size: 13px; color: var(--text-soft); }
  .wx-now { display: flex; align-items: center; gap: 10px; }
  .wx-now svg { width: 40px; height: 40px; }
  .wx-now-temp { font-size: 34px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .wx-now-text { font-size: 13px; color: var(--text-soft); }

  /* 7 天排成 7 列；窗口很窄时整排可以左右滑动，不会挤变形 */
  .wx-days {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, minmax(78px, 1fr));
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .wx-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 14px 6px 12px;
    text-align: center;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: background 0.3s, transform 0.45s var(--ease);
    /* 数据到了之后，7 张卡片依次浮现（--i 是第几张，在 JS 里设置） */
    animation: wxIn 0.6s var(--ease) both;
    animation-delay: calc(var(--i) * 70ms);
  }
  .wx-day:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.08); }
  .wx-day.today { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.18); }
  .wx-label { font-size: 14px; font-weight: 900; }
  .wx-date { font-size: 11.5px; color: var(--text-soft); }
  .wx-icon { width: 44px; height: 44px; margin: 6px 0 2px; }
  .wx-icon svg { width: 100%; height: 100%; display: block; }
  .wx-text { font-size: 13px; font-weight: 700; }
  .wx-temp { margin-top: 2px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .wx-temp b { font-size: 16px; font-weight: 900; }            /* 最高温：大、粗 */
  .wx-temp span { margin-left: 6px; color: var(--text-soft); } /* 最低温：小、淡 */
  .wx-rain { font-size: 11.5px; color: #9fd0ff; }
  @keyframes wxIn { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

  /* 加载中：占位的灰块轻轻"呼吸" */
  .wx-day.skeleton { min-height: 196px; animation: wxPulse 1.4s ease-in-out infinite; animation-delay: 0s; }
  @keyframes wxPulse { 50% { opacity: 0.45; } }
  /* 获取失败：整排换成一句提示 + 重试按钮 */
  .wx-fail {
    grid-column: 1 / -1;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 14px;
    color: var(--text-soft);
  }

  /* ---------- 9.12 网站文件夹（右 1/3） ----------
     只显示前 4 个图标；点图标会直接打开网站，点图标以外的任何地方会展开全部（见下面的展开层）。 */
  .folder {
    padding: 26px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    cursor: pointer;                      /* 提示"这里可以点" */
    transition: transform 0.45s var(--ease);
  }
  .folder:hover { transform: translateY(-4px); }
  .folder:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .fold-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .fold-head .panel-title { margin-bottom: 0; }
  .fold-more { font-size: 12.5px; color: var(--text-soft); transition: color 0.25s; white-space: nowrap; }
  .folder:hover .fold-more { color: #fff; }
  .fold-preview {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);   /* 2 × 2 排列 */
    gap: 12px;
    align-content: center;
  }
  .fold-preview .tile { padding: 14px 6px 10px; gap: 8px; }
  .fold-preview .icon { width: 48px; height: 48px; border-radius: 14px; font-size: 20px; }

  /* ---------- 9.13 展开层：整个屏幕模糊 + 所有图标一起展开 ----------
     平时是透明、藏起来的；<body> 加上 fold-open 就显示。
     "屏幕变模糊"靠的是这一层自己的 backdrop-filter：它盖在整个页面上，把它后面的一切都模糊掉，
     模糊的程度从 0 渐变到 26px，所以是慢慢糊上去的。 */
  .fold-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;                           /* 比搜索栏、侧边栏、悬浮窗口都高，一起被模糊 */
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(4, 5, 12, 0);
    -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
    visibility: hidden;
    transition: background 0.5s var(--ease), backdrop-filter 0.5s var(--ease),
                -webkit-backdrop-filter 0.5s var(--ease), visibility 0s 0.5s;
  }
  body.fold-open { overflow: hidden; }      /* 展开时锁住页面滚动 */
  body.fold-open .fold-overlay {
    background: rgba(4, 5, 12, 0.42);
    -webkit-backdrop-filter: blur(26px) saturate(120%);
            backdrop-filter: blur(26px) saturate(120%);
    visibility: visible;
    transition: background 0.5s var(--ease), backdrop-filter 0.5s var(--ease),
                -webkit-backdrop-filter 0.5s var(--ease), visibility 0s 0s;
  }

  /* 展开后的面板：从文件夹的位置"长"出来（缩放中心由 JS 对准文件夹） */
  .fold-panel {
    position: relative;
    width: min(680px, 92vw);
    max-height: 86vh;
    overflow-y: auto;
    padding: 30px 30px 34px;
    border-radius: 30px;
    background: rgba(12, 12, 16, 0.62);
    outline: none;
    opacity: 0;
    scale: 0.4;
    transition: scale 0.55s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease-out;
  }
  body.fold-open .fold-panel { opacity: 1; scale: 1; transition: scale 0.55s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease-out; }
  .fold-panel .panel-title { font-size: 20px; margin-bottom: 22px; }
  .fold-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 14px;
  }
  /* 展开时每个图标依次"弹"出来：延迟 = 第几个 × 45ms（--i 在 JS 里设置） */
  .fold-grid .tile {
    opacity: 0;
    scale: 0.6;
    transition: transform 0.45s var(--ease), background 0.3s, opacity 0.25s, scale 0.25s;
  }
  body.fold-open .fold-grid .tile {
    opacity: 1;
    scale: 1;
    transition: transform 0.45s var(--ease), background 0.3s,
                opacity 0.4s var(--ease) calc(var(--i) * 45ms + 140ms),
                scale 0.5s cubic-bezier(0.32, 0.72, 0, 1) calc(var(--i) * 45ms + 140ms);
  }

  /* ---------- 9.14 署名 ----------
     放在页面内容的最末尾，往下滑到底才会看到（内容不够高时，它会沉在屏幕底部）。
     下面留了 104px 的空白：滑到底时它正好停在搜索栏（出现时）的上方，不会被挡住。
     清爽模式下会淡出，让壁纸干干净净。 */
  .credit {
    flex: none;
    padding: 4px 0 104px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(244, 244, 246, 0.5);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    transition: opacity 0.6s var(--ease);
  }
  body.clean .credit { opacity: 0; }

  /* ---------- 9.15 音乐播放器窗口（网易云音乐） ----------
     外壳用的是和番茄钟、计算器一样的 .win（可拖动、从侧边栏按钮里长出来 / 收回去）。 */
  .music { right: 92px; top: 12vh; width: 300px; padding: 20px 20px 16px; }
  .music-now { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; padding-right: 26px; }
  .music-cover {
    position: relative;
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #7c8cff, #c46bff);   /* 还没有封面时的渐变底 */
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }
  .music-cover svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .music-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .music-info { flex: 1; min-width: 0; }
  .music-title { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-artist { margin-top: 3px; font-size: 12.5px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-lyric { min-height: 22px; margin-bottom: 12px; text-align: center; font-size: 13px; line-height: 1.5; }
  .music-bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); cursor: pointer; overflow: hidden; }
  .music-fill { width: 0; height: 100%; background: #fff; border-radius: 99px; }
  .music-times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11.5px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .music-ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .mbtn {
    width: 40px;
    height: 40px;
    padding: 0;
    display: grid;
    place-items: center;
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.25s, transform 0.3s var(--ease);
  }
  .mbtn:hover { background: rgba(255, 255, 255, 0.16); transform: scale(1.06); }
  .mbtn:active { transform: scale(0.94); }
  .mbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .mbtn svg { width: 20px; height: 20px; fill: currentColor; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .mbtn.big { width: 50px; height: 50px; color: #0c0c10; background: #fff; }
  .mbtn.big:hover { background: #e9e9ef; }
  .mbtn.mode { width: auto; height: 32px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; }
  .mbtn .i-pause { display: none; }                   /* 播放中显示"暂停"图标，暂停时显示"播放"图标 */
  .mbtn.on .i-pause { display: block; }
  .mbtn.on .i-play { display: none; }
  .music-list {
    max-height: 168px;               /* 列表最高 168px，歌多了就在里面上下滑动（鼠标滚轮 / 触控板双指） */
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid var(--glass-border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scrollbar-width: thin;
  }
  .music-row {
    flex: none;                      /* 关键：不许被压扁。列表放不下时，是整个列表滑动，而不是每一行被挤小 */
    padding: 7px 8px;
    text-align: left;
    font: inherit;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--text-soft);
    background: transparent;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    white-space: normal;             /* 歌名太长就换行显示完整，不再用省略号截断 */
    overflow-wrap: anywhere;
    transition: background 0.2s, color 0.2s;
  }
  .music-row:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .music-row.current { background: rgba(255, 255, 255, 0.14); color: #fff; font-weight: 700; }
  .music-empty { padding: 10px 8px; font-size: 12.5px; line-height: 1.6; color: var(--text-soft); }
  /* 音乐正在播放时，侧边栏里的音符按钮会轻轻"呼吸"，提醒你它还在放（即使窗口关着） */
  .cbtn.playing { animation: musicPulse 2.4s ease-in-out infinite; }
  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    50% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.22); }
  }

  /* ---------- 9.16 桌宠 ----------
     平时收在清爽模式侧边栏的按钮里；点按钮才出现在屏幕右下角，再点一次收回去。
     没有窗口外壳、没有背景，也没有关闭按钮：想收起它，只能再点侧边栏里的那个按钮。
     层级 130：比所有悬浮窗口（从 120 开始往上排）都高，所以永远不会被窗口盖住；
     又比"搜索时的整屏模糊层"（135）低，所以搜索时它也会跟着一起被模糊。 */
  .pet {
    position: fixed;
    right: 0;                        /* 紧贴屏幕右下角：图片的右边和下边本来就是"被画面裁掉"的，贴着屏幕边缘刚好 */
    bottom: 0;
    z-index: 130;
    width: 200px;
    pointer-events: none;            /* 外框不接收鼠标；只有里面的图片（轮廓内）能被点到 */
    transform-origin: 100% 100%;     /* 从右下角"弹"出来 / 缩回去 */
    transform: scale(0);
    opacity: 0;
    visibility: hidden;
    /* 收起：先快后慢地缩小；visibility 等动画播完才隐藏 */
    transition: transform 0.35s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.25s ease 0.1s, visibility 0s 0.35s;
  }
  .pet.open {
    transform: scale(1);
    opacity: 1;
    visibility: visible;
    /* 出现：用带"回弹"的曲线（数值大于 1 的那一项就是过冲），所以有 Q 弹感 */
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s, visibility 0s;
  }
  .pet-img {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    -webkit-user-drag: none;
    transform-origin: 50% 100%;      /* 点击时的"压扁"以底边为准，脚（下边缘）不动，只有上半身在变形 */
    /* 点击区域：只有角色的轮廓里面才算点到，透明的地方点不到，也不会挡住后面的东西。
       （多边形是用抠好的图自动算出来的，顶点是百分比） */
    clip-path: polygon(49.0% 0.0%, 39.6% 2.6%, 35.2% 5.2%, 31.9% 7.8%, 29.6% 10.4%, 35.8% 13.0%, 30.4% 15.6%, 26.2% 18.2%, 21.0% 20.9%, 16.9% 23.5%, 13.5% 26.1%, 10.4% 28.7%, 8.1% 31.3%, 5.8% 33.9%, 4.2% 36.5%, 2.9% 39.1%, 1.9% 41.7%, 1.7% 44.3%, 2.1% 46.9%, 3.3% 49.5%, 2.3% 52.1%, 1.5% 54.7%, 0.8% 57.4%, 1.0% 60.0%, 1.7% 62.6%, 3.8% 65.2%, 5.0% 67.8%, 4.4% 70.4%, 4.0% 73.0%, 3.8% 75.6%, 3.8% 78.2%, 4.2% 80.8%, 4.8% 83.4%, 5.0% 86.0%, 3.5% 88.6%, 2.1% 91.2%, 1.0% 93.9%, 0.4% 96.5%, 0.0% 99.1%, 0.0% 99.8%, 100.0% 99.8%, 100.0% 99.1%, 100.0% 96.5%, 100.0% 93.9%, 100.0% 91.2%, 100.0% 88.6%, 100.0% 86.0%, 100.0% 83.4%, 100.0% 80.8%, 100.0% 78.2%, 100.0% 75.6%, 100.0% 73.0%, 100.0% 70.4%, 100.0% 67.8%, 100.0% 65.2%, 100.0% 62.6%, 100.0% 60.0%, 100.0% 57.4%, 100.0% 54.7%, 100.0% 52.1%, 100.0% 49.5%, 100.0% 46.9%, 100.0% 44.3%, 100.0% 41.7%, 98.1% 39.1%, 100.0% 36.5%, 96.7% 33.9%, 97.5% 31.3%, 92.7% 28.7%, 91.7% 26.1%, 87.1% 23.5%, 84.6% 20.9%, 81.7% 18.2%, 77.9% 15.6%, 72.7% 13.0%, 63.1% 10.4%, 62.5% 7.8%, 61.3% 5.2%, 58.8% 2.6%, 52.3% 0.0%);
  }
  /* 偶尔冒出来的对话框：悬在头顶左上方，两个小圆圈一路指向头发。它不放在 .pet-img 里面，所以角色被压扁时它不会跟着变形 */
  .pet-bubble {
    position: absolute;
    bottom: calc(100% + 26px);       /* 在宠物头顶上方；下面留出小圆圈的位置 */
    right: 52%;
    padding: 12px 24px;
    font-size: 22px;
    font-weight: 900;
    line-height: 1.2;
    white-space: nowrap;
    color: #4a1f14;
    background: #fff;
    border: 4px solid #4a1f14;
    border-radius: 50%;              /* 椭圆形 */
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    pointer-events: none;
    opacity: 0;
    scale: 0.5;
    transform-origin: 85% 130%;      /* 从靠近头的那一边弹出来 */
    transition: opacity 0.25s, scale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pet-bubble.show { opacity: 1; scale: 1; }
  .pet-bubble i { position: absolute; background: #fff; border: 3px solid #4a1f14; border-radius: 50%; }
  .pet-bubble .d1 { width: 16px; height: 16px; right: 18px; bottom: -22px; }
  .pet-bubble .d2 { width: 10px; height: 10px; right: 6px; bottom: -34px; }

  /* ---------- 9.17 彩蛋场景：聚光灯的画布 + 第二个桌宠（DeepSeek） ---------- */
  /* 聚光灯画在这张铺满屏幕的画布上。层级 126：盖在所有悬浮窗口（120 起）上面，
     但在两个桌宠（129、130）下面，所以灯光不会把桌宠"染色"。鼠标点击会穿透它。 */
  .lights {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 126;
    pointer-events: none;
    display: none;                   /* 平时完全不存在；彩蛋开始时 JS 才让它显示 */
  }
  .lights.on { display: block; }

  /* 第二个桌宠：彩蛋开始时从屏幕下方升起来，站在 Claude 的左边。
     right: 150px —— 它的右边缘离屏幕右边 150px，比 Claude（宽 200px）更靠里，
     所以它"被画面裁掉"的那条直切边正好藏在 Claude 身后（我用两张抠好的图算过，这样一点都不会露出来）。
     层级 129：在 Claude（130）后面。不接收鼠标，不会挡住任何东西。 */
  .pet-ds {
    position: fixed;
    right: 150px;
    bottom: 0;
    width: 200px;
    z-index: 129;
    pointer-events: none;
    transform: translateY(105%);     /* 平时藏在屏幕下方的外面 */
    visibility: hidden;
    transition: transform 0.35s cubic-bezier(0.5, 0, 0.75, 0), visibility 0s 0.35s;
  }
  .pet-ds.show {
    transform: translateY(0);
    visibility: visible;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s;   /* 升起来时带回弹，和 Claude 一样 Q 弹 */
  }
  .pet-ds img {
    display: block;
    width: 100%;
    height: auto;
    transform-origin: 50% 100%;      /* Q 弹时底边不动 */
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ---------- 10. 入场动画（只做一次） ----------
     模块按顺序从下方浮现。--i 是顺序号（在 HTML 里写），越小越先出现。 */
  .reveal {
    opacity: 0;
    translate: 0 26px;       /* 用 translate 属性，不会和搜索栏的 transform 打架 */
    transition: opacity 0.9s var(--ease), translate 0.9s var(--ease);
    transition-delay: calc(var(--i) * 0.13s + 0.25s);
  }
  body.ready .reveal { opacity: 1; translate: 0 0; }

  /* ---------- 11. 手机 / 窄屏：全部改成单列，上下排 ---------- */
  @media (max-width: 860px) {
    .page { grid-template-columns: 1fr; padding: 28px 16px 24px; }
    .page > * { grid-column: 1 / -1; }   /* 窄屏时每个模块都占满一整行 */
    .profile, .clockcal { height: auto; }   /* 窄屏单列排列时不需要固定高度（句子最多 3 行，本身就有上限） */
    .clockcal { grid-template-columns: 1fr; }
    .calendar { padding-left: 0; border-left: none; padding-top: 22px; border-top: 1px solid var(--glass-border); }
  }

  /* ---------- 12. 系统开了"减少动画"时，尊重它 ---------- */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .bg { transform: none; filter: none; }
    .reveal { opacity: 1; translate: none; }
  }
</style>
</head>

<body>
  <!-- 背景图层 -->
  <div class="bg"></div>

  <main class="page">

    <!-- ===== 模块①：个人信息（左上角） ===== -->
    <section class="profile glass spot reveal" style="--i:0">
      <!-- 头像：【改这里】把 avatar.jpg 换成你上传的头像文件名。
           没传的时候会显示"海"字渐变圆；onerror 的意思是"图片加载失败就把它去掉" -->
      <div class="profile-top">
        <div class="avatar">
          <span>海</span>
          <img src="avatar.jpg" alt="头像" onerror="this.remove()">
        </div>
        <div>
          <!-- 问候语由 script 按当前时间自动换（早上好 / 中午好 / 下午好 / 晚上好 …） -->
          <h1 id="greeting">你好，海参</h1>
          <!-- 每日金句：由 script 从 hitokoto 接口取来填进去。点一下可以换一句 -->
          <p class="quote" id="quote" title="点击换一句">
            <span id="quote-text">正在获取今日金句…</span>
            <small id="quote-from"></small>
          </p>
        </div>
      </div>

      <!-- 今日日程：同一个位置有两种状态（样式见 CSS 的 6.5）
           ① 没写：显示提示 + 输入框，按 Enter 确认
           ② 写好：提示淡出，显示"今天要做的事"和你写的内容（不能再改）
           当天再打开会保留，第二天自动清空。逻辑在 script 的 C2 部分。 -->
      <div class="todo" id="todo">
        <form class="todo-ask" id="todo-form" autocomplete="off">
          <div class="todo-ask-title">今天要做些什么？</div>
          <!-- maxlength 是最多能输入多少字，想放宽就改这个数字 -->
          <input type="text" id="todo-input" maxlength="60" placeholder="写完按 Enter 确认" aria-label="今天要做些什么">
        </form>
        <div class="todo-done" aria-live="polite">
          <div class="todo-done-label">今天要做的事</div>
          <div class="todo-item">
            <!-- 勾选框：点一下表示完成。里面的 svg 是那个"勾"，平时被藏起来 -->

    <section class="site-panel ft-panel glass spot reveal" style="--i:3">

    <!--
      想再加一个模块？复制下面这一整段，去掉首尾的注释符号，改里面的内容即可。

  </main>

  <!-- 署名：在页面内容的最末尾，往下滑到底才会看到（样式见 CSS 9.14） -->

  <div class="search-veil" id="search-veil"></div>

  <form class="searchbar glass spot" id="searchbar"

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

  <!-- ===== 清爽模式：屏幕正上方的时钟 =====
       平时是隐藏的；进入清爽模式后淡入。没有玻璃底，直接写在壁纸上。
       里面的数字由 script 的 tick() 和左边模块里的时钟一起更新。 -->
  <div class="cclock" aria-hidden="true">
    <div class="ctime"><span id="chm">00:00</span><span class="csec" id="csec">00</span></div>
    <div class="cdate" id="cdate"></div>
  </div>

  <!-- ===== 右侧侧边栏（平时透明，鼠标靠近才滑出来） =====

       下面依次是音乐、番茄时钟、计算器、桌宠（这四个只在清爽模式下出现）。
       【以后加新功能】在这里再写一个 <button type="button" class="cbtn spot" ...> 就行，
       侧边栏会自己变长。 -->
  <aside class="corner glass spot" id="corner" aria-label="功能侧边栏">
    <button type="button" class="cbtn spot" id="clean-btn" title="清爽模式（按 C）" aria-label="切换清爽模式" aria-pressed="false">C</button>
    <button type="button" class="cbtn spot" id="music-btn" title="音乐" aria-label="打开或关闭音乐播放器">

    </button>
    <button type="button" class="cbtn spot" id="pomo-btn" title="番茄时钟" aria-label="打开或关闭番茄时钟">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="13.5" r="7.5"></circle><path d="M12 9.5v4l2.5 2"></path><path d="M9.5 2.5h5"></path>

    </button>

      <svg viewBox="0 0 24 24" aria-hidden="true">

        <path d="M8.5 7.5h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"></path>
      </svg>
    <button type="button" class="cbtn spot" id="pet-btn" title="桌宠" aria-label="召唤或收起桌宠" aria-pressed="false">
      <!-- 猫爪印图标：四个脚趾 + 一个大肉垫 -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="6.5" cy="11" r="1.8"></circle><circle cx="10" cy="6.5" r="1.8"></circle>
        <circle cx="14" cy="6.5" r="1.8"></circle><circle cx="17.5" cy="11" r="1.8"></circle>
        <path d="M12 12.5c-3 0-5 2.6-5 4.8 0 1.6 1.4 2.2 2.8 2 .9-.1 1.4-.4 2.2-.4s1.3.3 2.2.4c1.4.2 2.8-.4 2.8-2 0-2.2-2-4.8-5-4.8z"></path>
      </svg>

  <!-- ===== 番茄时钟窗口（可拖动） =====
       data-phase 表示现在的阶段，由 script 来改：
         idle = 等你输入分钟数    work = 专注倒计时    break = 休息倒计时
       CSS 会根据它自动切换显示哪一块。 -->
  <div class="win pomo glass spot" id="pomo" data-phase="idle" role="dialog" aria-label="番茄时钟">
    <div class="pomo-head">番茄时钟</div>
    <!-- 右上角的 X：关闭窗口（计时不会停） -->
    <button type="button" class="pomo-close" id="pomo-close" aria-label="关闭番茄时钟">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg>
    </button>

    <div class="pomo-body">
      <!-- 状态一：输入这一轮要专注几分钟，按 Enter 开始 -->
      <form class="pomo-ask" id="pomo-form" autocomplete="off">
        <div class="pomo-sub">这一轮专注多少分钟？</div>
        <input type="text" id="pomo-input" inputmode="numeric" maxlength="3"
               placeholder="输入整数，按 Enter 开始" aria-label="专注分钟数">
      </form>
      <!-- 状态二：倒计时（专注和休息共用这一块，只是文字和进度条颜色不同） -->
      <div class="pomo-run">
        <div class="pomo-phase" id="pomo-phase">专注中</div>
        <div class="pomo-time" id="pomo-time">00:00</div>
        <div class="pomo-track"><div class="pomo-fill" id="pomo-fill"></div></div>
        <!-- 计时中才看得到这两个按钮：
             停止计时 = 暂停（再点一下变成"继续计时"）；重新输入 = 放弃这一轮，回到输入框 -->
        <div class="pomo-actions">
          <button type="button" class="pomo-act" id="pomo-pause">停止计时</button>
          <button type="button" class="pomo-act" id="pomo-redo">重新输入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 计算器窗口（可拖动，只在清爽模式下通过侧边栏打开） =====
       每个按键上的 data-k 是它的"身份"，script 靠它判断按了什么：
         数字 0-9、小数点 "."、运算符 + - * /、等于 "="、
         sqrt（开根号）、sq（平方）、neg（正负号）、back（退格）、ac（全部清零） -->
  <div class="win calc glass spot" id="calc" role="dialog" aria-label="计算器">
    <div class="pomo-head">计算器</div>
    <button type="button" class="pomo-close" id="calc-close" aria-label="关闭计算器">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg>
    </button>

    <!-- 屏幕：上面一行是算式（小字），下面是当前数字（大字） -->
    <div class="calc-screen">
      <div class="calc-expr" id="calc-expr"></div>
      <div class="calc-out" id="calc-out">0</div>
    </div>

    <!-- 按键：4 列 × 6 行（最下面一行是占满整行的等号）
         ± = 正负号：把屏幕上的数变成相反数；刚按完运算符时按它，可以直接输入一个负数 -->
    <div class="calc-keys" id="calc-keys">
      <button type="button" class="ck fn" data-k="ac">AC</button>
      <button type="button" class="ck fn" data-k="back" aria-label="退格">←</button>
      <button type="button" class="ck fn" data-k="sqrt" aria-label="开根号">√</button>
      <button type="button" class="ck fn" data-k="sq" aria-label="平方">x²</button>

      <button type="button" class="ck" data-k="7">7</button>
      <button type="button" class="ck" data-k="8">8</button>
      <button type="button" class="ck" data-k="9">9</button>
      <button type="button" class="ck op" data-k="/" aria-label="除">÷</button>

      <button type="button" class="ck" data-k="4">4</button>
      <button type="button" class="ck" data-k="5">5</button>
      <button type="button" class="ck" data-k="6">6</button>
      <button type="button" class="ck op" data-k="*" aria-label="乘">×</button>

      <button type="button" class="ck" data-k="1">1</button>
      <button type="button" class="ck" data-k="2">2</button>
      <button type="button" class="ck" data-k="3">3</button>
      <button type="button" class="ck op" data-k="-" aria-label="减">−</button>

      <button type="button" class="ck fn" data-k="neg" aria-label="正负号">±</button>
      <button type="button" class="ck" data-k="0">0</button>
      <button type="button" class="ck" data-k=".">.</button>
      <button type="button" class="ck op" data-k="+" aria-label="加">+</button>

      <button type="button" class="ck eq" data-k="=" aria-label="等于">=</button>
    </div>
  </div>

  <!-- ===== 音乐播放器窗口（播放本地音乐文件，可拖动，通过清爽模式侧边栏的音符按钮打开） =====
       关掉窗口音乐不会停（和番茄钟一样），侧边栏的音符按钮会一直轻轻"呼吸"提醒你。 -->
  <div class="win music glass spot" id="music" role="dialog" aria-label="音乐播放器">
    <div class="pomo-head">音乐</div>
    <button type="button" class="pomo-close" id="music-close" aria-label="关闭音乐窗口">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg>
    </button>

    <!-- 封面 + 歌名 + 歌手 -->
    <div class="music-now">
      <div class="music-cover">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
        <img id="music-cover" alt="">
      </div>
      <div class="music-info">
        <div class="music-title" id="music-title">还没有开始播放</div>
        <div class="music-artist" id="music-artist">点一下 ▶ 开始</div>
      </div>
    </div>

    <!-- 歌词：当前唱到的这一句（需要在 SONGS 里给这首歌配 .lrc 歌词文件才有） -->
    <div class="music-lyric" id="music-lyric"></div>

    <!-- 进度条（点一下可以跳到那个位置）和时间 -->
    <div class="music-bar" id="music-bar"><div class="music-fill" id="music-fill"></div></div>
    <div class="music-times"><span id="music-cur">00:00</span><span id="music-dur">00:00</span></div>

    <!-- 控制：播放模式 / 上一首 / 播放暂停 / 下一首 -->
    <div class="music-ctrl">
      <button type="button" class="mbtn mode" id="music-mode" title="切换播放模式">列表循环</button>
      <button type="button" class="mbtn" id="music-prev" aria-label="上一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M19 6L9.5 12 19 18z"></path></svg>
      </button>
      <button type="button" class="mbtn big" id="music-play" aria-label="播放或暂停">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3.4"></path></svg>
      </button>
      <button type="button" class="mbtn" id="music-next" aria-label="下一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M5 6l9.5 6L5 18z"></path></svg>
      </button>

    <!-- 歌曲列表：点哪首就播哪首 -->

  <!-- ===== 桌宠（清爽模式下，通过侧边栏的猫爪按钮召唤 / 收起） =====
       .pet 是外框，.pet-img 是图片（点击的就是它），.pet-bubble 是偶尔冒出来的对话框。
       图片文件在 icons 文件夹里（文件名在 script 配置区的 PET_IMG），第一次召唤时才开始加载。 -->
  <div class="pet" id="pet" aria-hidden="true">
    <div class="pet-bubble" id="pet-bubble"><span id="pet-say"></span><i class="d1"></i><i class="d2"></i></div>

  </div>

  <!-- ===== 彩蛋场景 =====
       <canvas>：聚光灯（画在上面）；.pet-ds：第二个桌宠（DeepSeek）。

  <canvas class="lights" id="lights" aria-hidden="true"></canvas>

  <!-- ===== 文件夹展开层 =====
