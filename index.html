<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起始页</title>

<!--
  ============================================================
  这是你的浏览器起始页。整个文件分三大块：
    1. <style>   —— 外观（颜色、磨砂玻璃、动画）
    2. <body>    —— 页面里有哪些东西（时钟、搜索框、快捷方式）
    3. <script>  —— 让页面"动起来"的逻辑（走时、问候语、生成快捷方式）

  你最常改的只有两处，我都用【改这里】标出来了：
    - 背景图的文件名
    - 快捷方式列表（在最底下的 script 里）
  ============================================================
-->

<style>
  /* ---------- 1. 全局变量：想换配色、模糊程度，改这里就行 ---------- */
  :root {
    --glass-bg: rgba(255, 255, 255, 0.14);        /* 玻璃的底色，数字越大越白 (0~1) */
    --glass-bg-hover: rgba(255, 255, 255, 0.24);  /* 鼠标移上去时的底色 */
    --glass-border: rgba(255, 255, 255, 0.30);    /* 玻璃边缘的细亮线 */
    --glass-blur: 22px;                           /* 磨砂程度：越大越模糊 */
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.74);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);       /* 动画的"手感"曲线：先快后慢，比较顺滑 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto,
                 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    overflow-x: hidden;
    background: #0d1226; /* 万一背景图加载失败时的保底色 */
  }

  /* ---------- 2. 背景图层 ---------- */
  .bg {
    position: fixed;
    inset: 0;          /* 铺满整个屏幕 */
    z-index: -1;       /* 放到所有内容的后面 */

    /* 【改这里】把 bg.jpg 换成你自己上传的图片文件名。
       如果图片还没传，后面的渐变色会顶上，页面也不会难看。
       三层从上到下：①压暗的渐变（让文字更清楚） ②你的图片 ③保底渐变 */
    background:
      linear-gradient(180deg, rgba(8, 12, 30, 0.25), rgba(8, 12, 30, 0.55)),
      url("bg.jpg") center / cover no-repeat,
      linear-gradient(135deg, #1b2a5e 0%, #5b3a8c 50%, #d4668a 100%);

    /* 打开页面时的动画起点：放大一点 + 模糊，然后缓缓对焦（见下面 .ready） */
    transform: scale(1.08);
    filter: blur(18px);
    transition: transform 1.6s var(--ease), filter 1.6s var(--ease);
  }
  body.ready .bg { transform: scale(1); filter: blur(0); }

  /* ---------- 3. 磨砂玻璃：核心就是 backdrop-filter ----------
     给任何元素加上 class="glass"，它就会变成玻璃。
     backdrop-filter 的意思是：把"这个元素背后的画面"模糊掉。 */
  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 10px 34px rgba(0, 0, 0, 0.22),            /* 外阴影，让玻璃"浮"起来 */
      inset 0 1px 0 rgba(255, 255, 255, 0.38);    /* 顶部一条高光，质感的关键 */
  }

  /* ---------- 4. 页面布局：全部居中，上下排列 ---------- */
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 40px 20px;
  }

  /* 时钟区域 */
  .clock { text-align: center; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.35); }
  .time {
    font-size: clamp(76px, 15vw, 160px);  /* 随屏幕宽度自动缩放，最小76 最大160 */
    font-weight: 200;                     /* 很细的字重，显得精致 */
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;   /* 数字等宽，秒数变化时不会左右抖 */
  }
  .greeting {
    margin-top: 14px;
    font-size: clamp(16px, 2.2vw, 21px);
    color: var(--text-soft);
    letter-spacing: 0.04em;
  }

  /* 搜索框 */
  .search {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(560px, 90vw);
    height: 58px;
    padding: 0 22px;
    border-radius: 999px;   /* 超大圆角 = 胶囊形 */
    transition: width 0.5s var(--ease), background 0.3s, box-shadow 0.3s, transform 0.5s var(--ease);
  }
  /* 点进搜索框时：变宽一点、变亮、外面出现一圈光 —— 这就是"交互动画" */
  .search:focus-within {
    width: min(680px, 92vw);
    background: var(--glass-bg-hover);
    transform: translateY(-2px);
    box-shadow:
      0 14px 44px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.45),
      0 0 0 4px rgba(255, 255, 255, 0.16);
  }
  .search svg { width: 20px; height: 20px; flex: none; opacity: 0.8; }
  .search input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;       /* 去掉浏览器默认的丑边框（我们用上面的光圈代替） */
    color: var(--text);
    font-size: 17px;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-soft); }

  /* 快捷方式区域 */
  .links {
    display: flex;
    flex-wrap: wrap;       /* 放不下就自动换行 */
    justify-content: center;
    gap: 16px;
    max-width: 760px;
  }
  .tile {
    width: 108px;
    padding: 18px 8px 14px;
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 13.5px;
    transition: transform 0.45s var(--ease), background 0.3s, box-shadow 0.45s var(--ease);
  }
  /* 鼠标移上去：上浮 + 放大一点 + 变亮 */
  .tile:hover {
    transform: translateY(-8px) scale(1.05);
    background: var(--glass-bg-hover);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  /* 按下去的瞬间：轻轻缩一下，像真的按了按钮 */
  .tile:active { transform: translateY(-2px) scale(0.96); transition-duration: 0.12s; }

  .icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    display: grid;
    place-items: center;   /* 里面的字/图居中 */
    font-size: 22px;
    font-weight: 600;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .tile span.name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 5. 打开页面时的入场动画（只做这一次，保持克制） ----------
     三个区块（时钟 / 搜索框 / 快捷方式）依次从下方浮现。
     --i 是顺序号，在 HTML 里设置：0 最先，数字越大越晚。 */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    transition-delay: calc(var(--i) * 0.14s + 0.25s);
  }
  body.ready .reveal { opacity: 1; transform: none; }
  /* 注意：.search 自己也有 transform 过渡，入场结束后由 JS 去掉 .reveal 避免冲突（见 script） */

  /* ---------- 6. 键盘 Tab 选中时的可见边框（无障碍） ---------- */
  .tile:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* ---------- 7. 如果系统设置了"减少动画"，就尊重它，关掉所有动画 ---------- */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .bg { transform: none; filter: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>

<body>
  <!-- 背景图层（样式在上面的 .bg） -->
  <div class="bg"></div>

  <main>
    <!-- 时钟：具体的时间和问候语由底下的 script 自动填进去 -->
    <section class="clock reveal" style="--i:0">
      <div class="time" id="time">00:00</div>
      <div class="greeting" id="greeting">你好</div>
    </section>

    <!-- 搜索框：提交后用 Google 搜索。想换成别的搜索引擎，改 action 那一行 -->
    <form class="search glass reveal" style="--i:1"
          action="https://www.google.com/search" method="get">
      <!-- 放大镜图标（SVG，不需要额外图片） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input type="text" name="q" id="q" placeholder="搜索，或按 / 键快速聚焦"
             autocomplete="off" aria-label="搜索">
    </form>

    <!-- 快捷方式：这里是空的，由 script 根据下面的列表自动生成 -->
    <nav class="links reveal" style="--i:2" id="links" aria-label="快捷方式"></nav>
  </main>

<script>
  /* ============================================================
     【改这里】快捷方式列表
     每一行是一个网站，格式：
       { name: "显示的名字", url: "网址" },
     想用自己的图标：先把图片上传到 GitHub，再多写一项 icon: "图片文件名"
       例：{ name: "GitHub", url: "https://github.com", icon: "github.png" },
     不写 icon 的话，会自动用名字的第一个字，配一个好看的渐变色。
     想加网站：复制一行，改名字和网址；想删：删掉那一整行。
     注意每一行末尾的逗号不要漏掉。
     ============================================================ */
  const LINKS = [
    { name: "Google",   url: "https://www.google.com" },
    { name: "YouTube",  url: "https://www.youtube.com" },
    { name: "Gmail",    url: "https://mail.google.com" },
    { name: "GitHub",   url: "https://github.com" },
    { name: "Drive",    url: "https://drive.google.com" },
    { name: "哔哩哔哩", url: "https://www.bilibili.com" },
  ];

  /* ---------- A. 生成快捷方式 ---------- */
  const linksBox = document.getElementById("links");

  LINKS.forEach((item) => {
    // 创建一个 <a> 链接，并套上玻璃样式
    const a = document.createElement("a");
    a.className = "tile glass";
    a.href = item.url;

    // 图标部分
    const icon = document.createElement("div");
    icon.className = "icon";
    if (item.icon) {
      // 有图片：显示图片
      const img = document.createElement("img");
      img.src = item.icon;
      img.alt = "";
      icon.appendChild(img);
    } else {
      // 没图片：取名字第一个字，用它算出一个固定的色相，做渐变背景
      const ch = item.name.charAt(0).toUpperCase();
      const hue = (ch.charCodeAt(0) * 47) % 360;
      icon.textContent = ch;
      icon.style.background =
        `linear-gradient(135deg, hsl(${hue} 78% 66%), hsl(${(hue + 40) % 360} 78% 54%))`;
    }

    // 名字部分
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;

    a.append(icon, name);
    linksBox.appendChild(a);
  });

  /* ---------- B. 时钟 + 问候语 ---------- */
  const timeEl = document.getElementById("time");
  const greetEl = document.getElementById("greeting");

  // 数字补零：5 -> "05"
  const pad = (n) => String(n).padStart(2, "0");

  function tick() {
    const now = new Date();
    timeEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());

    // 根据小时数选问候语
    const h = now.getHours();
    let hello = "晚上好";
    if (h < 5)        hello = "夜深了，早点休息";
    else if (h < 12)  hello = "早上好";
    else if (h < 14)  hello = "中午好";
    else if (h < 18)  hello = "下午好";

    // 顺便显示日期，例如：10月16日 星期五
    const date = now.toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
    greetEl.textContent = hello + " · " + date;
  }
  tick();                       // 打开页面时先跑一次
  setInterval(tick, 1000);      // 之后每 1 秒刷新一次

  /* ---------- C. 键盘小技巧：按 "/" 直接跳到搜索框 ---------- */
  const q = document.getElementById("q");
  document.addEventListener("keydown", (e) => {
    // 如果你已经在输入框里打字，就不拦截
    if (e.key === "/" && document.activeElement !== q) {
      e.preventDefault();
      q.focus();
    }
  });

  /* ---------- D. 触发入场动画 ---------- */
  // 等页面绘制完成后，给 body 加上 "ready"，CSS 里的动画就会开始播放
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));

  // 入场动画播完后，去掉 .reveal，防止它和搜索框自己的悬停/聚焦动画互相干扰
  setTimeout(() => {
    document.querySelectorAll(".reveal").forEach((el) => el.classList.remove("reveal"));
  }, 2200);
</script>
</body>
</html>
