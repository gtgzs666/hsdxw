  <div class="fold-overlay" id="fold-overlay" aria-hidden="true">
    <section class="fold-panel glass" id="fold-panel" tabindex="-1" role="dialog" aria-label="常用网站">
      <button type="button" class="pomo-close" id="fold-close" aria-label="关闭">
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg>
      </button>
      <h2 class="panel-title">常用网站</h2>
      <nav class="fold-grid" id="fold-grid" aria-label="全部常用网站"></nav>
    </section>
  </div>

<script>
  /* ============================================================
     【改这里】常用网站列表
     每一行一个网站：
       { name: "显示的名字", url: "网址", icon: "图标文件名" },
     图标文件放在 icons 文件夹里（文件夹名在下面的 ICON_DIR），这里只写文件名，不用写 "icons/"。
     图标还没传也没关系，会先显示名字的第一个字（带渐变色）。
     想加网站：复制一行改一改；想删：删掉整行；每行末尾的逗号别漏。
     【顺序很重要】最前面的 4 个会显示在页面上的文件夹里，其余的点开文件夹后才看得到。
     ============================================================ */
  const SITES = [
    { name: "哔哩哔哩",     url: "https://www.bilibili.com",                icon: "bilibili.png" },
    // 注意：云星穹铁道的网址我不确定对不对，如果打不开，请告诉我你平时用的入口
    { name: "云星穹铁道",   url: "https://sr.mihoyo.com/cloud",             icon: "starrail.png" },
    { name: "百度贴吧",     url: "https://tieba.baidu.com",                 icon: "tieba.png" },
    { name: "Claude",       url: "https://claude.ai",                       icon: "claude.png" },
    { name: "ChatGPT",      url: "https://chatgpt.com",                     icon: "gpt.png" },
    { name: "SLS",          url: "https://vle.learning.moe.edu.sg",         icon: "sls.png" },
    { name: "Google 课堂",  url: "https://classroom.google.com",            icon: "classroom.png" },
  ];

  /* ============================================================
     【改这里】资源文件夹 + 音乐列表
     把图片和音乐分别放进仓库里的两个文件夹（和 index.html 放在同一层）：
       icons/   网站图标（上面 SITES 里写的 icon 文件）
       music/   音乐文件（以及可选的：封面图、歌词文件）
     下面两个常量就是这两个文件夹的名字，如果你给文件夹起了别的名字，改这里（别漏了最后的 "/"）。
     ============================================================ */
  const ICON_DIR  = "icons/";
  const MUSIC_DIR = "music/";

  /* 音乐列表：每一行一首，播放顺序就是这里的顺序；想加歌就多写一行，想删就删掉那一行，行末的逗号别漏。
     最省事的写法：直接写文件名。如果文件名是 "歌手 - 歌名.mp3"（歌手和歌名之间是 空格-空格），
       播放器会自动拆出歌手和歌名来显示。
     完整写法：写成 { file: ... } 的形式，可以指定歌名、歌手，还能配封面图和歌词（封面、歌词文件也放在 music 文件夹里）。
     注意：
       - 文件名要和文件夹里的一模一样，包括大小写和扩展名（GitHub 的网页区分大小写）。
       - 浏览器能直接播放 mp3、m4a、flac、ogg、wav。网易云自己的加密格式（比如 .ncm）浏览器放不了。
       - 用网页上传文件时，单个文件不能超过 25 MB。 */
  const SONGS = [
    "Everywhere We Go.mp3",
    "Wake.mp3",
    "ソラゴト（虚言）.mp3",
    "夜行列車～nothing to lose～.mp3",
    // { file: "01.mp3", title: "歌名", artist: "歌手", cover: "01.jpg", lyric: "01.lrc" },   // ← 完整写法的例子
  ];

  /* ============================================================
     【改这里】桌宠设置
     ============================================================ */
  const PET_IMG      = "pet.png";          // 桌宠图片，放在 icons 文件夹里
  const PET_SAY      = "中国人...";         // 点击时偶尔冒出来的对话框里的字
  const PET_EGG_SONG = "朋友的酒.mp3";      // 彩蛋播放的歌，放在 music 文件夹里（文件名要和这里一模一样）
  const PET_BUBBLE_CHANCE = 1 / 5;         // 每次点击冒出对话框的概率（固定不变：1/5 = 20%）
  const PET_BUBBLE_MS     = 2000;          // 对话框停留多久（毫秒）
  const PET_COMBO         = 20;            // 连续点击多少下触发彩蛋
  const PET_COMBO_GAP     = 1500;          // "连续"的意思：两次点击之间不超过这么久（毫秒），超过了就重新数
  const PET2_IMG = "ds.png";               // 彩蛋时从 Claude 左边冒出来的第二个桌宠（DeepSeek），放在 icons 文件夹里

  /* 彩蛋时的聚光灯 */
  const SPOT_COUNT    = 5;                 // 聚光灯的基础数量。每束灯"换班"（旧的淡出、新的淡入）的那一瞬间会多出一束，
                                           // 所以屏幕上看到的是 5~6 束；想要 6~7 束就改成 6

  /* ---------- A. 工具：生成"首字母渐变图标"（图片没传或加载失败时用） ---------- */
  function letterIcon(box, name) {
    const ch = name.charAt(0).toUpperCase();
    const hue = (ch.charCodeAt(0) * 47) % 360;   // 同一个字永远得到同一种颜色
    box.textContent = ch;
    box.style.background = `linear-gradient(135deg, hsl(${hue} 75% 62%), hsl(${(hue + 40) % 360} 75% 50%))`;
  }

  /* ---------- B. 网站图标 + 文件夹 ----------
     makeTile(网站)：造出一个图标卡片（<a> 链接）。文件夹里的预览和展开后的面板都用它来造。 */
  function makeTile(s) {
    const a = document.createElement("a");
    a.className = "tile spot";      // spot：让每个小卡片也有鼠标聚光
    a.href = s.url;

    const icon = document.createElement("div");
    icon.className = "icon";
    if (s.icon) {
      const img = document.createElement("img");
      img.src = assetPath(ICON_DIR, s.icon);   // 例："bilibili.png" → "icons/bilibili.png"
      img.alt = "";
      img.onerror = () => { img.remove(); letterIcon(icon, s.name); };  // 图片加载失败 → 改用首字母
      icon.appendChild(img);
    } else {
      letterIcon(icon, s.name);
    }

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name;

    a.append(icon, name);
    return a;
  }

  const folderEl    = document.getElementById("folder");
  const foldPreview = document.getElementById("fold-preview");
  const foldOverlay = document.getElementById("fold-overlay");
  const foldPanel   = document.getElementById("fold-panel");
  const foldGrid    = document.getElementById("fold-grid");

  // 文件夹里只放前 4 个
  SITES.slice(0, 4).forEach((s) => foldPreview.appendChild(makeTile(s)));
  // 展开面板里放全部，并给每个图标编号 --i（CSS 用它算"依次弹出"的延迟）
  SITES.forEach((s, i) => {
    const t = makeTile(s);
    t.style.setProperty("--i", i);
    foldGrid.appendChild(t);
  });
  document.getElementById("fold-count").textContent = SITES.length + " 个";

  /* 展开 / 收起
     原理：给 <body> 加上或去掉 fold-open，CSS 负责所有动画（模糊、面板缩放、图标依次弹出）。
     JS 只额外做一件事：把面板"缩放的中心点"对准文件夹，这样面板像是从文件夹里长出来的。 */
  function aimPanelAtFolder() {
    const f = folderEl.getBoundingClientRect();
    // offsetLeft / offsetTop 是面板"没被缩放时"的位置，不受动画影响，算出来才准
    const x = f.left + f.width / 2 - foldPanel.offsetLeft;
    const y = f.top + f.height / 2 - foldPanel.offsetTop;
    foldPanel.style.transformOrigin = x + "px " + y + "px";
  }
  function openFold() {
    if (document.body.classList.contains("fold-open")) return;
    aimPanelAtFolder();
    document.body.classList.add("fold-open");
    foldOverlay.setAttribute("aria-hidden", "false");
    folderEl.setAttribute("aria-expanded", "true");
    requestAnimationFrame(() => foldPanel.focus({ preventScroll: true }));
  }
  function closeFold() {
    if (!document.body.classList.contains("fold-open")) return;
    aimPanelAtFolder();                      // 收起时也朝文件夹缩回去（页面被锁住没滚动，位置不变）
    document.body.classList.remove("fold-open");
    foldOverlay.setAttribute("aria-hidden", "true");
    folderEl.setAttribute("aria-expanded", "false");
    folderEl.focus({ preventScroll: true });
  }

  // 点文件夹：点到的是图标（<a>）就让它正常打开网站；点到其他任何地方才展开
  folderEl.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    openFold();
  });
  // 键盘：焦点在文件夹本身时，按 Enter 或空格展开
  folderEl.addEventListener("keydown", (e) => {
    if (e.target !== folderEl) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFold(); }
  });
  // 收起：点面板外面的模糊区域 / 点 X / 按 Esc
  foldOverlay.addEventListener("click", (e) => { if (e.target === foldOverlay) closeFold(); });
  document.getElementById("fold-close").addEventListener("click", closeFold);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFold(); });

  /* ---------- C. 每日金句（hitokoto 接口） ----------
     逻辑：同一天内先用缓存（所以是"每日"金句）；点击句子可以手动换一句。
     接口会返回一个对象：hitokoto = 句子，from = 出处，from_who = 作者。
     想限定类型，可以把网址改成 https://v1.hitokoto.cn/?c=d&c=i （d=文学 i=诗词，更多类型见官网文档） */
  // 【改这里】句子最长多少个字。接口自己会按这个长度挑句子；
  // 万一还是超出，页面上也最多显示 3 行（见 CSS），模块的大小不会变。
  const QUOTE_MAX = 40;
  const quoteBox  = document.getElementById("quote");
  const quoteText = document.getElementById("quote-text");
  const quoteFrom = document.getElementById("quote-from");

  const todayKey = () => {
    const d = new Date();
    return "hitokoto-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  };

  function showQuote(d) {
    quoteText.textContent = d.hitokoto;
    quoteFrom.textContent = d.from
      ? "—— " + (d.from_who ? d.from_who + " · " : "") + d.from
      : "";
  }

  async function loadQuote(forceNew) {
    // 先看今天有没有存过
    if (!forceNew) {
      try {
        const saved = localStorage.getItem(todayKey());
        if (saved) {
          const d = JSON.parse(saved);
          // 以前缓存下来的句子如果太长（超过 QUOTE_MAX 个字），就不用它，重新取一句短的
          if (d.hitokoto && d.hitokoto.length <= QUOTE_MAX) { showQuote(d); return; }
        }
      } catch (e) { /* 读缓存失败就忽略，继续联网取 */ }
    }
    try {
      const res = await fetch("https://v1.hitokoto.cn/?max_length=" + QUOTE_MAX);
      const data = await res.json();
      showQuote(data);
      try { localStorage.setItem(todayKey(), JSON.stringify(data)); } catch (e) {}
    } catch (err) {
      // 联网失败：给一句保底的话，并提示怎么办
      showQuote({ hitokoto: "今天也要好好加油。", from: "（金句暂时获取失败，点击重试）" });
    }
  }
  loadQuote(false);

  // 点击换一句：先淡出，换完再淡入（这是"你操作后的反馈动画"）
  quoteBox.addEventListener("click", async () => {
    quoteBox.classList.add("swap");
    await new Promise((r) => setTimeout(r, 250));
    await loadQuote(true);
    quoteBox.classList.remove("swap");
  });

  /* ---------- C2. 今日日程 ----------
     规则：
       - 输入后按 Enter：提示淡出，内容以大字显示，且不能再修改
       - 内容存在浏览器的 localStorage 里，key 带着今天的日期
       - 当天再打开，读到今天的 key → 直接显示内容
       - 第二天日期变了，key 对不上 → 自动回到"今天要做些什么？"，旧内容也会被清掉
     注意：localStorage 存在你这台浏览器里，换一台设备不会同步。 */
  const todoBox   = document.getElementById("todo");
  const todoForm  = document.getElementById("todo-form");
  const todoInput = document.getElementById("todo-input");
  const todoText  = document.getElementById("todo-text");

  // 今天的 key，例如 "todo-2026-10-16"
  const todoKey = () => {
    const d = new Date();
    return "todo-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  };

  // 页面打开时 / 过了午夜时调用：看看今天有没有存过
  function initTodo() {
    let saved = null;
    try {
      saved = localStorage.getItem(todoKey());
      // 顺手清掉以前日子留下的内容
      Object.keys(localStorage).forEach((k) => {
        if (k.startsWith("todo-") && k !== todoKey()) localStorage.removeItem(k);
      });
    } catch (e) { /* 读不了就当没存过 */ }

    // 先把"完成动画"的状态清掉，保证每次都从干净的状态开始
    todoBox.classList.remove("completing", "striking");

    if (saved) {
      todoText.textContent = saved;        // 用 textContent，输入什么字符都安全
      todoBox.classList.add("done");
    } else {
      todoText.textContent = "";
      todoInput.value = "";
      todoBox.classList.remove("done");
    }
  }

  // 小工具：等待 ms 毫秒（配合 await 就能把动画一步一步排队）
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 点击勾选框 = 完成。时序：
  //   ① 方框变白、勾被画出来         （completing）
  //   ② 0.45 秒后文字开始被划线      （striking）
  //   ③ 划线开始 5 秒后，整块淡出，输入框重新出现
  // 同时把今天存的内容删掉：完成了就算完成了，刷新页面也不会再冒出来
  const todoCheck = document.getElementById("todo-check");
  todoCheck.addEventListener("click", async () => {
    if (todoBox.classList.contains("completing")) return;   // 防止连点

    todoBox.classList.add("completing");
    try { localStorage.removeItem(todoKey()); } catch (e) {}

    await wait(450);
    todoBox.classList.add("striking");

    await wait(5000);
    todoBox.classList.remove("done");        // 触发淡出；输入框会稍后淡入（见 CSS）

    await wait(700);                         // 等淡出完全结束，再悄悄把状态复位
    todoBox.classList.remove("completing", "striking");
    todoText.textContent = "";
    todoInput.value = "";
  });

  // 按 Enter 提交
  todoForm.addEventListener("submit", (e) => {
    e.preventDefault();                    // 阻止表单默认的"刷新页面"
    const v = todoInput.value.trim();
    if (!v) return;                        // 什么都没写就不处理
    todoText.textContent = v;
    try { localStorage.setItem(todoKey(), v); } catch (err) {}
    todoInput.blur();
    todoBox.classList.add("done");         // 触发 CSS 里的淡出/淡入切换
  });

  /* ---------- D. 时钟 + 日历 ---------- */
  const hmEl = document.getElementById("hm");
  const secEl = document.getElementById("sec");
  const weekdayEl = document.getElementById("weekday");
  const fulldateEl = document.getElementById("fulldate");
  const calTitle = document.getElementById("cal-title");
  const calGrid = document.getElementById("cal-grid");
  // 清爽模式下屏幕正上方的时钟（必须在 tick() 第一次运行之前找到它们）
  const chmEl = document.getElementById("chm");
  const csecEl = document.getElementById("csec");
  const cdateEl = document.getElementById("cdate");

  // 欢迎语：按当前小时换问候词。
  const USER_NAME = "海参";   // 【改这里】显示在问候语后面的名字
  /* GREET-START */
  // 时间段：0–4 点 夜深了 / 5–11 点 早上好 / 12–13 点 中午好 / 14–17 点 下午好 / 18–23 点 晚上好
  // 想改分界，改下面的数字就行（h 是"现在几点"，0~23）
  function greetingFor(h) {
    if (h < 5)  return "夜深了";
    if (h < 12) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }
  /* GREET-END */
  const greetingEl = document.getElementById("greeting");

  const pad = (n) => String(n).padStart(2, "0");   // 5 → "05"
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  // 画日历。每周从"周一"开始。today 那一天会加上 .today 样式（高亮）
  function renderCalendar(now) {
    const y = now.getFullYear();
    const m = now.getMonth();           // 注意：月份从 0 开始，0 = 1月
    const today = now.getDate();

    calTitle.textContent = y + "年" + (m + 1) + "月";
    calGrid.innerHTML = "";

    // 先放上表头：一 二 三 四 五 六 日
    ["一", "二", "三", "四", "五", "六", "日"].forEach((w) => {
      const h = document.createElement("div");
      h.className = "wd";
      h.textContent = w;
      calGrid.appendChild(h);
    });

    // 这个月 1 号是星期几？用来决定前面要空几格（周一为第一列）
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    for (let i = 0; i < offset; i++) calGrid.appendChild(document.createElement("div"));

    // 这个月一共多少天？（下个月的第 0 天 = 本月最后一天）
    const total = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= total; d++) {
      const cell = document.createElement("div");
      cell.className = "day" + (d === today ? " today" : "");
      cell.textContent = d;
      calGrid.appendChild(cell);
    }
  }

  let lastDay = -1;
  function tick() {
    const now = new Date();
    hmEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    secEl.textContent = pad(now.getSeconds());
    weekdayEl.textContent = "星期" + WEEK[now.getDay()];
    fulldateEl.textContent = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";

    // 问候语：只有文字真的变了才去改（每秒都会走到这里）
    const greetText = greetingFor(now.getHours()) + "，" + USER_NAME;
    if (greetingEl.textContent !== greetText) greetingEl.textContent = greetText;

    // 同步给清爽模式的时钟
    chmEl.textContent = hmEl.textContent;
    csecEl.textContent = secEl.textContent;
    cdateEl.textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日 · 星期" + WEEK[now.getDay()];

    // 日期变了（比如过了午夜）才重画日历，平时不重复画
    if (now.getDate() !== lastDay) {
      lastDay = now.getDate();
      renderCalendar(now);
      initTodo();   // 新的一天：日程也一起检查/清除（第一次打开页面也会走这里）
    }
  }
  tick();
  setInterval(tick, 1000);   // 每秒刷新一次

  /* ---------- E. 鼠标聚光：把鼠标位置告诉每个 .spot ----------
     原理：算出鼠标相对于这个元素左上角的位置，写进 --mx / --my，
     CSS 里的 radial-gradient 就会以这个点为中心发光。 */
  document.addEventListener("mousemove", (e) => {
    document.querySelectorAll(".spot").forEach((el) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
  });

  /* ---------- F. 搜索栏 ----------
     搜索栏平时是藏起来的（CSS 里 opacity:0），三种情况下才出现：
       ① 鼠标移到屏幕底部   ② 按 "/" 键   ③ 里面已经有文字
     点进搜索框（或按 / 键）的那一刻，整个屏幕就会被模糊层盖住，只有搜索栏保持清晰，不需要等你打字。
     收起搜索栏：按 Esc，或点一下模糊的区域（会同时清空里面的文字）。 */
  /* SEARCH-START */
  const q = document.getElementById("q");
  const searchBar = document.getElementById("searchbar");
  const searchVeil = document.getElementById("search-veil");
  let searchNear = false;       // 鼠标现在是不是在"屏幕底部"这个区域里

  function setSearchNear(on) {
    if (on === searchNear) return;
    searchNear = on;
    searchBar.classList.toggle("near", on);      // CSS 看到 .near 就把搜索栏显示出来
  }

  // 鼠标位置判断：离屏幕底边 70px 以内就算"到了底部"；
  // 一旦出现，范围会放大到 170px（这样鼠标从底边往上移去点搜索栏时，它不会又缩回去）
  document.addEventListener("mousemove", (e) => {
    if (document.body.classList.contains("fold-open")) { setSearchNear(false); return; }   // 文件夹展开时不出现
    if (document.querySelector(".win.dragging, .win.gliding")) return;                      // 拖动窗口时不触发
    setSearchNear(e.clientY > window.innerHeight - (searchNear ? 170 : 70));
  });
  // 鼠标离开浏览器窗口时，也把它收起来
  document.documentElement.addEventListener("mouseleave", () => setSearchNear(false));

  // 同步搜索栏的状态：
  //   search-active（加在 <body> 上）= 输入框获得了焦点（点进去 / 按了 /）→ 模糊层出现
  //   has-text（加在搜索栏上）        = 里面有字 → 搜索栏一直保持显示，直到清空
  function syncSearch() {
    document.body.classList.toggle("search-active", document.activeElement === q);
    searchBar.classList.toggle("has-text", q.value !== "");
  }
  q.addEventListener("input", syncSearch);
  q.addEventListener("focus", syncSearch);
  q.addEventListener("blur", syncSearch);

  // 收起：清空文字 + 失去焦点 → 模糊层消失，搜索栏也跟着藏起来
  function closeSearch() {
    q.value = "";
    q.blur();
    syncSearch();
  }
  // 点模糊的区域 = 收起。mousedown 要先拦住，否则输入框会先失焦、模糊层先消失，那一下点击就会落到后面的东西上
  searchVeil.addEventListener("mousedown", (e) => e.preventDefault());
  searchVeil.addEventListener("click", closeSearch);

  document.addEventListener("keydown", (e) => {
    // 按 "/" 唤出搜索栏。以下情况不处理：
    //   你正在某个输入框里打字（不然在日程里打"/"会被抢走）、文件夹展开着、
    //   计算器开着（这时 "/" 是除号）
    if (e.key === "/" &&
        document.activeElement.tagName !== "INPUT" &&
        !document.body.classList.contains("fold-open") &&
        !calcEl.classList.contains("open")) {
      e.preventDefault();
      q.focus();                                 // 一聚焦，CSS 的 :focus-within 就会让它显示出来
    }
    // Esc：搜索栏正在使用（或里面还有字）时，收起它
    if (e.key === "Escape" && (document.activeElement === q || q.value !== "")) closeSearch();
  });
  /* SEARCH-END */

  /* ============================================================
     H. 清爽模式
     原理非常简单：给 <body> 加上或去掉 class="clean"，
     所有"清爽模式下的样子"都写在 CSS 的 body.clean 规则里（见 CSS 9.5）。
     切换方式：点右下角的 C 按钮，或者按键盘上的 C。
     ============================================================ */
  const corner   = document.getElementById("corner");
  const cleanBtn = document.getElementById("clean-btn");
  const isClean  = () => document.body.classList.contains("clean");

  function setClean(on) {
    // 如果光标还停在某个输入框里，先让它失焦，免得模块隐藏后还在抢键盘
    const a = document.activeElement;
    if (a && a.tagName === "INPUT") a.blur();

    document.body.classList.toggle("clean", on);
    cleanBtn.setAttribute("aria-pressed", String(on));

    // 退出清爽模式 = 番茄钟停止（你要求的规则）
    if (!on) { stopPomo(); closeCalc(); closeMusic(); closePet(); }   // 音乐窗口会收起，但音乐不会停；想暂停：再按 C，打开音乐窗口
  }
  const toggleClean = () => setClean(!isClean());

  cleanBtn.addEventListener("click", toggleClean);

  // 键盘 C 切换。注意：你正在输入框里打字时不能触发，否则写"cat"会把模式切来切去
  document.addEventListener("keydown", (e) => {
    if (e.key !== "c" && e.key !== "C") return;
    if (document.body.classList.contains("fold-open")) return;   // 文件夹展开时不切换清爽模式
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;   // Ctrl+C 复制等组合键不处理
    const tag = document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    toggleClean();
  });

  // 鼠标靠近右侧侧边栏时，给 #corner 加上 .near，它就会滑出来（样式见 CSS 的 .corner.near）。
  // 判断方法：量出侧边栏现在的位置，鼠标离它不到 NEAR_PAD 像素就算"靠近"。
  // 以后侧边栏里多加按钮、它变长了，这个判断会自动跟着变，不用改。
  const NEAR_PAD = 90;
  document.addEventListener("mousemove", (e) => {
    const r = corner.getBoundingClientRect();
    corner.classList.toggle(
      "near",
      e.clientX > r.left - NEAR_PAD &&        // 横向：离侧边栏左边缘 90px 以内（右边就是屏幕边缘）
      e.clientY > r.top - NEAR_PAD &&         // 纵向：在侧边栏上下各 90px 的范围内
      e.clientY < r.bottom + NEAR_PAD
    );
  });
  // 鼠标离开浏览器窗口时，也把侧边栏收起来
  document.documentElement.addEventListener("mouseleave", () => corner.classList.remove("near"));

  /* ============================================================
     I. 番茄时钟
     流程：输入分钟 → 按 Enter → 专注倒计时 → 响铃 + 顶部提示
           → 固定休息 5 分钟 → 响铃 → 再次弹出输入框
     ============================================================ */
  const BREAK_MIN = 5;      // 【改这里】休息时长（分钟）
  const POMO_MAX  = 999;    // 【改这里】一轮专注最多允许输入多少分钟

  const pomoEl    = document.getElementById("pomo");
  const pomoBtn   = document.getElementById("pomo-btn");
  const pomoClose = document.getElementById("pomo-close");
  const pomoForm  = document.getElementById("pomo-form");
  const pomoInput = document.getElementById("pomo-input");
  const pomoPhase = document.getElementById("pomo-phase");
  const pomoTime  = document.getElementById("pomo-time");
  const pomoFill  = document.getElementById("pomo-fill");
  const toastEl   = document.getElementById("toast");
  const pomoPauseBtn = document.getElementById("pomo-pause");   // 停止计时（暂停 / 继续）
  const pomoRedoBtn  = document.getElementById("pomo-redo");    // 重新输入

  let pomoTimer = null;   // 定时器编号
  let pomoEnd = 0;        // 这一阶段"结束的时刻"（毫秒时间戳）
  let pomoTotal = 0;      // 这一阶段总共多少毫秒
  let toastTimer = null;
  let pomoPaused = false; // 现在是不是"暂停"状态
  let pomoLeft = 0;       // 暂停那一刻还剩多少毫秒（继续时要用）

  /* ----- 铃声：用浏览器自带的声音合成器"现场造"一个钟声，不需要音频文件 -----
     浏览器规定：必须在你操作过页面（比如按 Enter）之后才允许发声，
     所以我们在"开始计时"那一刻就把声音系统准备好。 */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  // 敲一下钟：把几个不同频率的正弦波叠在一起，每个都从响变到静，就像金属的余音
  function bell(t, freq) {
    [[1, 0.5], [2.76, 0.22], [5.4, 0.1]].forEach(([mult, vol]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq * mult;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.01);   // 0.35 是总音量，嫌吵就改小
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.9);
    });
  }
  // 连敲 count 下，每下间隔 1.1 秒
  function ring(count, freq) {
    ensureAudio();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + 0.05;
    for (let i = 0; i < count; i++) bell(t0 + i * 1.1, freq);
  }

  /* ----- 屏幕正上方的提示条 ----- */
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 10000);   // 10 秒后自动消失
  }
  function hideToast() {
    toastEl.classList.remove("show");
    clearTimeout(toastTimer);
  }
  toastEl.addEventListener("click", hideToast);   // 点一下也能关

  /* ----- 窗口的打开 / 关闭（只是显示和隐藏，不影响计时） ----- */
  function openPomo() {
    pomoEl.classList.add("open");
    bringToFront(pomoEl);
    // 如果正等着输入，就直接把光标放进输入框
    if (pomoEl.dataset.phase === "idle") requestAnimationFrame(() => pomoInput.focus());
  }
  function closePomo() {
    // 关闭前先算好"缩放中心"= 侧边栏里番茄钟按钮的位置，窗口就会朝着它收进去
    if (pomoEl.classList.contains("open")) aimAt(pomoEl, pomoBtn);
    pomoEl.classList.remove("open");
    if (document.activeElement === pomoInput) pomoInput.blur();
  }
  pomoBtn.addEventListener("click", () => {
    pomoEl.classList.contains("open") ? closePomo() : openPomo();
  });
  pomoClose.addEventListener("click", closePomo);

  /* ----- 倒计时 -----
     不是"每秒减 1"，而是记下"结束的时刻"，每次用 结束时刻 - 现在 来算还剩多久。
     这样即使浏览器把后台标签页的定时器拖慢，时间也不会走偏。 */
  function startPhase(phase, minutes) {
    pomoEl.dataset.phase = phase;                          // "work" 或 "break"，CSS 据此切换显示
    setPaused(false);                                      // 新的一段计时一定是"进行中"
    renderPhaseLabel();
    pomoTotal = minutes * 60 * 1000;
    pomoEnd = Date.now() + pomoTotal;
    clearInterval(pomoTimer);
    pomoTimer = setInterval(pomoTick, 250);
    pomoTick();
  }

  function pomoTick() {
    const left = Math.max(0, pomoEnd - Date.now());
    const s = Math.ceil(left / 1000);                      // 向上取整：还剩 0.3 秒也显示 00:01
    pomoTime.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    pomoFill.style.width = ((1 - left / pomoTotal) * 100) + "%";   // 进度条
    if (left <= 0) {
      clearInterval(pomoTimer);
      pomoTimer = null;
      onPhaseEnd();
    }
  }

  function onPhaseEnd() {
    if (pomoEl.dataset.phase === "work") {
      // 专注结束：响铃 + 屏幕上方提示 + 自动进入固定的休息倒计时
      // （窗口关着也一样：提示条是独立的，不依赖窗口）
      ring(3, 880);
      showToast("Claude提醒你该休息了");
      startPhase("break", BREAK_MIN);
    } else {
      // 休息结束：响铃（音调更高一点），回到输入状态，并把窗口弹出来
      ring(2, 1175);
      resetPomo();
      openPomo();
    }
  }

  // 回到"等你输入"的初始状态
  function resetPomo() {
    pomoEl.dataset.phase = "idle";
    setPaused(false);
    pomoInput.value = "";
    pomoTime.textContent = "00:00";
    pomoFill.style.width = "0%";
  }

  // 彻底停止（退出清爽模式时调用）：停表、复位、关窗口、收起提示条
  function stopPomo() {
    clearInterval(pomoTimer);
    pomoTimer = null;
    resetPomo();
    closePomo();
    hideToast();
  }

  // 输入分钟数，按 Enter 开始
  pomoForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const raw = pomoInput.value.trim();
    const n = parseInt(raw, 10);
    // 必须是纯数字的整数，并且在 1 ~ POMO_MAX 之间；否则输入框抖一下
    if (!/^\d+$/.test(raw) || n < 1 || n > POMO_MAX) {
      pomoInput.classList.remove("shake");
      void pomoInput.offsetWidth;          // 小技巧：强制重新计算，让抖动动画能重复播放
      pomoInput.classList.add("shake");
      return;
    }
    ensureAudio();                          // 趁"用户刚按过 Enter"，把声音系统准备好
    pomoInput.blur();
    startPhase("work", n);
  });

  /* ----- 暂停 / 继续 / 重新输入 -----
     "停止计时"：把现在还剩多久记下来，停掉定时器（数字会变暗）；再点一次就从剩下的时间继续。
     "重新输入"：放弃这一轮（专注或休息都一样），回到输入框，可以重新写分钟数。 */
  function renderPhaseLabel() {
    const base = pomoEl.dataset.phase === "break" ? "休息中" : "专注中";
    pomoPhase.textContent = base + (pomoPaused ? " · 已暂停" : "");
  }
  function setPaused(on) {
    pomoPaused = on;
    pomoEl.dataset.paused = String(on);                    // CSS 靠它把暂停时的数字变暗
    pomoPauseBtn.textContent = on ? "继续计时" : "停止计时";
    renderPhaseLabel();
  }

  pomoPauseBtn.addEventListener("click", () => {
    if (pomoEl.dataset.phase === "idle") return;
    if (!pomoPaused) {
      pomoLeft = Math.max(0, pomoEnd - Date.now());        // 记下还剩多少
      clearInterval(pomoTimer);
      pomoTimer = null;
      setPaused(true);
    } else {
      pomoEnd = Date.now() + pomoLeft;                     // 从"现在"开始，再数 pomoLeft 这么久
      clearInterval(pomoTimer);
      pomoTimer = setInterval(pomoTick, 250);
      setPaused(false);
      pomoTick();
    }
  });

  pomoRedoBtn.addEventListener("click", () => {
    clearInterval(pomoTimer);
    pomoTimer = null;
    resetPomo();                                           // 回到输入状态
    requestAnimationFrame(() => pomoInput.focus());        // 光标直接放进输入框
  });

  /* ============================================================
     J. 拖动窗口，并在松手后"惯性滑行"
     makeDraggable(要移动的窗口, 按住哪里可以拖, 哪些东西点了不触发拖动)

     为什么之前会卡：
       ① 以前是不停地改 left / top，每一帧浏览器都要重新排版；
       ② 窗口背后的磨砂模糊每一帧都要重新计算，非常吃性能。
     现在的做法：
       ① 用 transform 移动（显卡直接处理，不需要重新排版）；
       ② 每一帧最多更新一次（requestAnimationFrame）；
       ③ 拖动和滑行时保持完整的磨砂效果（样式见 CSS 9.7；若觉得卡，可调小 --drag-blur）。

     惯性怎么算：
       松手那一刻，用"最近 0.1 秒内鼠标走了多远 ÷ 用了多久"得到速度，
       之后每一帧让速度按指数规律衰减，位置 += 速度 × 时间，所以越滑越慢、自然停下。
       撞到屏幕边缘就贴边停住。
     ============================================================ */
  /* ----- 窗口层级：点到哪个窗口，哪个窗口就移到最上面 -----
     做法：记下所有窗口"从下到上"的顺序；点到某个窗口，就把它挪到队伍最后，
           然后按顺序重新给每个窗口分配 z-index（120、121、122……）。
     窗口的层级只在 120 起的一小段里排，不会冒到搜索时的模糊层（135）上面；
     桌宠是 130，永远比所有窗口都高。 */
  const WIN_BASE_Z = 120;
  let winOrder = null;                 // 第一次用到时才从页面里收集所有 .win
  function bringToFront(el) {
    if (!winOrder) winOrder = Array.prototype.slice.call(document.querySelectorAll(".win"));
    const i = winOrder.indexOf(el);
    if (i !== -1) winOrder.splice(i, 1);
    winOrder.push(el);
    winOrder.forEach((w, k) => { w.style.zIndex = String(WIN_BASE_Z + k); });
  }
  // 用"捕获"方式监听：不管点到窗口里的哪个地方（按钮、输入框、空白处），都会先触发这里
  document.addEventListener("pointerdown", (e) => {
    const w = e.target && e.target.closest ? e.target.closest(".win") : null;
    if (w) bringToFront(w);
  }, true);

  // 把窗口"缩放的中心点"设到某个按钮的位置：
  // 关闭时窗口会朝这个点缩小、收进按钮里；再次打开时就从那里"长"出来。
  // 只在窗口处于打开状态时调用（这时窗口大小是原始大小，算出来才准）。
  function aimAt(el, btn) {
    const w = el.getBoundingClientRect();
    const b = btn.getBoundingClientRect();
    el.style.transformOrigin = (b.left + b.width / 2 - w.left) + "px " + (b.top + b.height / 2 - w.top) + "px";
  }

  function makeDraggable(el, handle, ignoreSel) {
    let tx = 0, ty = 0;              // 窗口相对"原来位置"挪动了多少像素
    let dragRaf = 0, glideRaf = 0;   // requestAnimationFrame 的编号，用来随时取消

    const clampN = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
    const apply = () => { el.style.transform = "translate3d(" + tx + "px," + ty + "px,0)"; };

    // 窗口还能往每个方向挪多远：先倒推出"没挪动时的原位"，再换算成允许的偏移范围
    function bounds() {
      const r = el.getBoundingClientRect();
      const baseL = r.left - tx, baseT = r.top - ty;
      return {
        minX: -baseL, maxX: window.innerWidth - r.width - baseL,
        minY: -baseT, maxY: window.innerHeight - r.height - baseT,
      };
    }

    // 松手后的滑行
    function glide(vx, vy, b) {
      const MAX_SPEED = 2.4;                      // 速度上限（像素/毫秒），防止"甩飞出去"
      const sp = Math.hypot(vx, vy);
      if (sp < 0.12) return;                      // 太慢就不滑了
      if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }

      // 【改这里】滑行手感：TAU 越大滑得越远、越久。总滑行距离 ≈ 松手速度 × TAU
      // 比如正常拖动速度约 1 像素/毫秒，TAU=140 → 大约再滑 140 像素（之前是 280，现在减半）
      const TAU = 140;

      let last = performance.now();
      el.classList.add("gliding");
      const step = (now) => {
        const dt = Math.min(now - last, 40);      // 单帧最多算 40ms，避免切标签页回来时突然跳很远
        last = now;
        const k = Math.exp(-dt / TAU);            // 这一帧速度要乘以多少（<1，越来越慢）
        tx += vx * TAU * (1 - k);                 // 这一帧走过的距离（对衰减速度积分的结果）
        ty += vy * TAU * (1 - k);
        vx *= k; vy *= k;
        // 撞到屏幕边缘：贴边，并把这个方向的速度清零
        if (tx < b.minX) { tx = b.minX; vx = 0; } else if (tx > b.maxX) { tx = b.maxX; vx = 0; }
        if (ty < b.minY) { ty = b.minY; vy = 0; } else if (ty > b.maxY) { ty = b.maxY; vy = 0; }
        apply();
        if (Math.hypot(vx, vy) > 0.02) glideRaf = requestAnimationFrame(step);
        else el.classList.remove("gliding");      // 速度小到看不出来了，结束
      };
      glideRaf = requestAnimationFrame(step);
    }

    handle.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;                              // 只响应鼠标左键
      if (ignoreSel && e.target.closest(ignoreSel)) return;    // 点到输入框/按钮时不拖动
      cancelAnimationFrame(glideRaf);                          // 如果窗口还在滑，按住就让它立刻停下
      el.classList.remove("gliding");

      const b = bounds();
      const startX = e.clientX, startY = e.clientY;            // 按下时鼠标的位置
      const baseX = tx, baseY = ty;                            // 按下时窗口的偏移
      let nx = tx, ny = ty, queued = false;
      const samples = [{ t: performance.now(), x: tx, y: ty }];   // 记录最近的位置，用来算松手速度

      handle.setPointerCapture(e.pointerId);                   // 鼠标拖出窗口范围也继续跟随
      el.classList.add("dragging");

      const move = (ev) => {
        nx = clampN(baseX + ev.clientX - startX, b.minX, b.maxX);
        ny = clampN(baseY + ev.clientY - startY, b.minY, b.maxY);
        const now = performance.now();
        samples.push({ t: now, x: nx, y: ny });
        while (samples.length > 2 && now - samples[0].t > 100) samples.shift();   // 只留最近约 100ms
        if (!queued) {                                         // 每一帧最多画一次
          queued = true;
          dragRaf = requestAnimationFrame(() => { queued = false; tx = nx; ty = ny; apply(); });
        }
      };

      const up = () => {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
        cancelAnimationFrame(dragRaf);
        tx = nx; ty = ny; apply();
        el.classList.remove("dragging");

        // 算松手时的速度；如果松手前鼠标已经停了一会儿（>80ms），就不滑
        const now = performance.now();
        const first = samples[0], last = samples[samples.length - 1];
        let vx = 0, vy = 0;
        if (now - last.t < 80 && last.t - first.t > 8) {
          vx = (last.x - first.x) / (last.t - first.t);
          vy = (last.y - first.y) / (last.t - first.t);
        }
        glide(vx, vy, b);
      };

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });

    // 返回一个小工具：缩小浏览器窗口时，用它把窗口拉回屏幕内
    return {
      clamp() {
        const b = bounds();
        tx = clampN(tx, b.minX, b.maxX);
        ty = clampN(ty, b.minY, b.maxY);
        apply();
      },
    };
  }

  // 番茄钟窗口：在窗口任何空白处按住都能拖（点输入框和按钮除外）
  const pomoDrag = makeDraggable(pomoEl, pomoEl, "input, button");

  /* ============================================================
     K. 文件传输助手
     微信的网页不允许被嵌进别的网页，所以"打开"直接用浏览器的新窗口打开它。
     ============================================================ */
  const FT_URL = "https://filehelper.weixin.qq.com/";
  document.getElementById("ft-open").addEventListener("click", () => {
    window.open(FT_URL, "filehelper", "popup,width=460,height=780,noopener,noreferrer");
  });

  /* ============================================================
     L. 计算器（清爽模式侧边栏里的第三个按钮）
     支持：加、减、乘、除、开根号、平方，外加 AC（清零）、←（退格）、=（等于）。
     工作方式和普通手持计算器一样："边输入边算"：
       输入 12 → 按 × → 输入 3 → 按 + 的那一刻，会先算出 36，再等你输入下一个数。
     用到的几个状态（都放在 calc 这个对象里）：
       cur      屏幕上显示的数字（字符串）
       acc      前面已经算好的数
       op       等着执行的运算符（"+" "-" "*" "/"，没有就是 null）
       entered  按下运算符之后，你有没有输入新的数（输入了才需要先算一步）
       fresh    下一次按数字键，是"覆盖屏幕"还是"接着往后写"
       err      是不是刚出错（比如除以 0）
     ============================================================ */
  const calcEl   = document.getElementById("calc");
  const calcBtn  = document.getElementById("calc-btn");
  const calcOut  = document.getElementById("calc-out");
  const calcExpr = document.getElementById("calc-expr");
  const calcKeys = document.getElementById("calc-keys");

  /* CALC-LOGIC-START */
  const calc = { cur: "0", acc: null, op: null, entered: false, fresh: true, err: false, fx: null };   // fx：这次按键之后要播放动画的算式文字（没有就是 null）
  const OPS = { "+": (a, b) => a + b, "-": (a, b) => a - b, "*": (a, b) => a * b, "/": (a, b) => a / b };
  const OP_SHOW = { "+": "+", "-": "−", "*": "×", "/": "÷" };   // 算式行里显示的符号

  // 把数字变成好看的字符串：去掉 0.1+0.2=0.30000000000000004 这类浮点误差；太长就用科学计数法
  function fmtNum(n) {
    const t = parseFloat(n.toPrecision(12));
    let str = String(t);
    if (str.length > 14) str = t.toExponential(6).replace(/\.?0+e/, "e");
    return str;
  }
  const calcNum = () => parseFloat(calc.cur);

  function calcClear() {
    calc.cur = "0"; calc.acc = null; calc.op = null;
    calc.entered = false; calc.fresh = true; calc.err = false; calc.fx = null;
    calcExpr.textContent = "";
  }
  function calcError(msg) {        // 出错：清空一切，屏幕上显示错误信息；下次按任何键会自动清掉
    calcClear();
    calc.cur = msg;
    calc.err = true;
  }

  // 计算 a op b；除以 0 或结果超出范围时返回 { err: "说明" }
  function calcApply(a, op, b) {
    if (op === "/" && b === 0) return { err: "不能除以 0" };
    const v = OPS[op](a, b);
    if (!isFinite(v)) return { err: "超出范围" };
    return { v };
  }

  function calcDigit(d) {
    if (calc.fresh) { calc.cur = d; calc.fresh = false; }          // 刚算完/刚按了运算符：覆盖
    else if (calc.cur === "0") calc.cur = d;                       // 避免出现 "007"
    else if (calc.cur === "-0") calc.cur = "-" + d;                // 负数的开头："-0" 后面接数字 → "-5"
    else if (calc.cur.replace(/[-.]/g, "").length < 12) calc.cur += d;   // 最多 12 位数字
    calc.entered = true;
  }
  function calcDot() {
    if (calc.fresh) { calc.cur = "0."; calc.fresh = false; }
    else if (!calc.cur.includes(".")) calc.cur += ".";
    calc.entered = true;
  }

  function calcOp(o) {
    if (calc.op !== null && calc.entered) {
      // 前面已经有"等着执行的运算"，而且你又输入了新的数：先算一步
      const r = calcApply(calc.acc, calc.op, calcNum());
      if (r.err) return calcError(r.err);
      calc.acc = r.v;
      calc.cur = fmtNum(r.v);
    } else if (calc.op === null) {
      calc.acc = calcNum();                                        // 第一个数
    }
    // （如果已经有运算符、但你还没输入新的数，就只是"换一个运算符"）
    calc.op = o;
    calc.entered = false;
    calc.fresh = true;
    calcExpr.textContent = fmtNum(calc.acc) + " " + OP_SHOW[o];
  }

  function calcEquals() {
    if (calc.op === null) return;
    const b = calcNum();
    const r = calcApply(calc.acc, calc.op, b);
    if (r.err) return calcError(r.err);
    calcExpr.textContent = fmtNum(calc.acc) + " " + OP_SHOW[calc.op] + " " + fmtNum(b) + " =";
    calc.fx = calcExpr.textContent;          // 等号：这行算式要"飞"到上面去
    calc.cur = fmtNum(r.v);
    calc.acc = null; calc.op = null;
    calc.entered = false; calc.fresh = true;
  }

  // 开根号 / 平方：直接作用在屏幕上的数，结果替换屏幕；已经输入的"等着执行的运算"保持不变
  function calcUnary(kind) {
    const x = calcNum();
    let v, label;
    if (kind === "sqrt") {
      if (x < 0) return calcError("无效输入");
      v = Math.sqrt(x);
      label = "√(" + fmtNum(x) + ")";
    } else {
      v = x * x;
      if (!isFinite(v)) return calcError("超出范围");
      label = "(" + fmtNum(x) + ")²";
    }
    calc.cur = fmtNum(v);
    calc.entered = true;
    calc.fresh = true;
    calcExpr.textContent = (calc.op !== null ? fmtNum(calc.acc) + " " + OP_SHOW[calc.op] + " " : "") + label;
    calc.fx = calcExpr.textContent;          // 开根号 / 平方：同样播放动画
  }

  // 正负号 ±：
  //   正在输入数字时 → 给这个数加上或去掉负号
  //   刚按完运算符、在等你输入新数时 → 直接开始输入一个负数（先显示 "-0"，接着打数字就是 "-5" 这样）
  //   屏幕上是算出来的结果时 → 把结果变成相反数
  function calcNegate() {
    const flip = () => { calc.cur = calc.cur.startsWith("-") ? calc.cur.slice(1) : "-" + calc.cur; };
    if (calc.fresh) {
      const waiting = calc.op !== null && !calc.entered;
      if (waiting || calc.cur === "0") {          // 开头的 0，或者在等新数：开始输入负数
        calc.cur = "-0";
        calc.fresh = false;
      } else {
        flip();                                  // 屏幕上是结果：直接取反（仍然算"现成的数"，再按数字会覆盖）
      }
    } else {
      flip();
    }
    calc.entered = true;
  }

  function calcBack() {            // 退格：只能删你自己正在输入的数，不能删算出来的结果
    if (calc.fresh) return;
    calc.cur = calc.cur.length > 1 ? calc.cur.slice(0, -1) : "0";
    if (calc.cur === "-") calc.cur = "0";
  }

  // 刷新屏幕：数字太长时自动把字号调小；等着输入下一个数的运算符按钮会亮起来
  function calcShow() {
    calcOut.textContent = calc.cur;
    calcOut.style.fontSize = calc.cur.length > 14 ? "22px" : calc.cur.length > 10 ? "28px" : "";
    calcKeys.querySelectorAll(".op").forEach((b) => {
      b.classList.toggle("active", calc.op !== null && !calc.entered && b.dataset.k === calc.op);
    });
  }

  // 所有按键（鼠标点和键盘按）最终都走这里，k 就是按键的"身份"
  function calcPress(k) {
    calc.fx = null;                                                // 先清掉上一次的动画标记
    if (calc.err) calcClear();                                     // 上一次出错了：先清干净
    if (/^[0-9]$/.test(k)) calcDigit(k);
    else if (k === ".") calcDot();
    else if (k === "+" || k === "-" || k === "*" || k === "/") calcOp(k);
    else if (k === "=") calcEquals();
    else if (k === "sqrt" || k === "sq") calcUnary(k);
    else if (k === "neg") calcNegate();
    else if (k === "back") calcBack();
    else if (k === "ac") calcClear();
    calcShow();
  }
  /* CALC-LOGIC-END */

  /* CALC-ANIM-START */
  /* ----- 计算动画 -----
     按下 = 或 √ / x² 时：
       ① 原来的算式（比如 "36 + 4 ="）先以大字出现在结果的位置；
       ② 它一边缩小、一边飞到上面的算式行里（用的是 transform，所以很顺）；
       ③ 与此同时，结果从下方轻轻放大、渐渐显现出来。
     实现方式：临时造一个"飞行的算式"（.calc-ghost），用浏览器自带的 element.animate() 播放。
     动画期间真正的算式行先清空，飞到位之后再把文字填回去，所以不会出现两份。
     如果动画还没播完你又按了别的键：立刻停掉动画、把算式行还原，再处理新的按键。 */
  const calcScreen = calcOut.parentElement;      // .calc-screen（屏幕那个黑色框）
  const CALC_EASE = "cubic-bezier(0.32, 0.72, 0, 1)";
  let calcAnim = null;                           // 正在播放的动画：{ ghost, anims, formula }

  function calcStopAnim() {
    if (!calcAnim) return;
    calcAnim.anims.forEach((a) => a.cancel());
    calcAnim.ghost.remove();
    calcExpr.textContent = calcAnim.formula;     // 还原算式行，让接下来的逻辑看到正常状态
    calcAnim = null;
  }

  function playCalcAnim(formula) {
    // 系统开了"减少动画"，或者浏览器不支持 animate：直接跳过（算式行里已经有正确的文字）
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !calcOut.animate) return;

    calcExpr.textContent = "";                   // 先清空算式行，等"飞行的算式"落下来再填
    const ghost = document.createElement("div");
    ghost.className = "calc-ghost";
    ghost.textContent = formula;
    calcScreen.appendChild(ghost);

    // 量尺寸：算出起点（和结果同样大、同样的位置）、终点（算式行的位置和字号）
    const avail = calcScreen.clientWidth - 28;   // 屏幕左右各有 14px 内边距，可用宽度
    const gw = ghost.offsetWidth, gh = ghost.offsetHeight;
    const startScale = Math.min(1, avail / gw);  // 算式太长放不下时，起点就先缩小一点
    const fontRatio = parseFloat(getComputedStyle(calcExpr).fontSize) / parseFloat(getComputedStyle(ghost).fontSize);
    const endScale = Math.min(fontRatio, avail / gw);
    const top = calcOut.offsetTop + calcOut.offsetHeight / 2 - gh / 2;   // 让它和结果上下居中对齐
    ghost.style.top = top + "px";
    const dy = (calcExpr.offsetTop + calcExpr.offsetHeight / 2) - (top + gh / 2);   // 要往上飞多远

    const flyAnim = ghost.animate([
      { transform: "translateY(0px) scale(" + startScale + ")", color: "rgba(244,244,246,1)" },
      { transform: "translateY(" + dy + "px) scale(" + endScale + ")", color: "rgba(244,244,246,0.62)" },   // 终点颜色 = 算式行的颜色
    ], { duration: 560, easing: CALC_EASE, fill: "forwards" });

    // 结果：稍等 160 毫秒（让算式先动起来），再从下方、小一点、模糊的状态渐渐变清晰
    const resultAnim = calcOut.animate([
      { opacity: 0, transform: "translateY(12px) scale(0.82)", filter: "blur(4px)" },
      { opacity: 1, transform: "translateY(0) scale(1)", filter: "blur(0)" },
    ], { duration: 520, delay: 160, easing: CALC_EASE, fill: "backwards" });

    calcAnim = { ghost: ghost, anims: [flyAnim, resultAnim], formula: formula };
    flyAnim.onfinish = () => {
      if (!calcAnim || calcAnim.ghost !== ghost) return;   // 已经被新的按键打断了
      ghost.remove();
      calcExpr.textContent = formula;
      calcAnim = null;
    };
  }

  // 所有按键的统一入口：先停掉没播完的动画 → 处理按键 → 如果这次按键需要动画就播放
  function calcHandle(k) {
    calcStopAnim();
    calcPress(k);
    if (calc.fx) {
      const f = calc.fx;
      calc.fx = null;
      playCalcAnim(f);
    }
  }
  /* CALC-ANIM-END */

  // 鼠标点按键：用"事件委托"，只在外面的 calc-keys 上听一次，靠 data-k 判断点的是哪个
  calcKeys.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-k]");
    if (btn) calcHandle(btn.dataset.k);
  });

  // 键盘也能用：数字、小数点、+ - * /、Enter（或 =）、Backspace、Delete（清零）
  // 只在计算器开着、并且你没在输入框里打字时生效
  document.addEventListener("keydown", (e) => {
    if (!calcEl.classList.contains("open")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const a = document.activeElement;
    if (a.tagName === "INPUT" || a.tagName === "TEXTAREA") return;
    if (a.tagName === "BUTTON" && !a.dataset.k) return;           // 焦点在 X 之类的按钮上时，别抢它的回车
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key;
    else if (e.key === ".") k = ".";
    else if (e.key === "+" || e.key === "-" || e.key === "*" || e.key === "/") k = e.key;
    else if (e.key === "Enter" || e.key === "=") k = "=";
    else if (e.key === "Backspace") k = "back";
    else if (e.key === "Delete") k = "ac";
    if (k === null) return;
    e.preventDefault();               // 同时阻止按钮自己被"回车触发点击"，避免算两次
    calcHandle(k);
  });

  // 打开 / 关闭
  function openCalc() { calcEl.classList.add("open"); bringToFront(calcEl); }
  function closeCalc() {
    if (!calcEl.classList.contains("open")) return;
    aimAt(calcEl, calcBtn);                                        // 朝侧边栏的计算器按钮收进去
    calcEl.classList.remove("open");
  }
  calcBtn.addEventListener("click", () => {
    calcEl.classList.contains("open") ? closeCalc() : openCalc();
  });
  document.getElementById("calc-close").addEventListener("click", closeCalc);

  // 可拖动（点到按键不触发拖动；在屏幕和空白处按住就能拖）
  const calcDrag = makeDraggable(calcEl, calcEl, "button");
  calcShow();

  // 缩小浏览器窗口时，如果窗口被挤到屏幕外，把它们拉回来
  window.addEventListener("resize", () => { pomoDrag.clamp(); calcDrag.clamp(); });

  /* ============================================================
     M. 天气（Open-Meteo：免费、不需要注册和 key）
     做法：向 Open-Meteo 请求"未来 7 天"的预报，拿到每天的天气代码和最高/最低温，
          再画成 7 张卡片。天气代码是国际通用的 WMO 编号（0=晴、3=阴、61=小雨……），
          下面的 wxInfo() 负责把编号翻译成"文字 + 图标"。
     为了省流量，结果会缓存 30 分钟；请求失败时优先显示旧的缓存，没有缓存才显示"重试"。
     ============================================================ */
  const WX_LAT = 1.3521;      // 【改这里】纬度
  const WX_LON = 103.8501;    // 【改这里】经度
  const WX_URL = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + WX_LAT + "&longitude=" + WX_LON
    + "&current=temperature_2m,weather_code"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + "&timezone=Asia%2FSingapore&forecast_days=7";
  const WX_TTL = 30 * 60 * 1000;   // 缓存多久（毫秒）

  /* WX-PURE-START */
  /* ----- 简易天气图标：全部是手写的小 SVG，画在 48×48 的格子里 ----- */
  const COL_SUN = "#ffd35c", COL_CLOUD = "#f1f4fb", COL_RAINCLOUD = "#d5dbec", COL_STORMCLOUD = "#c3cadf", COL_DROP = "#7cc4ff";

  const svgWrap = (inner) => '<svg viewBox="0 0 48 48" aria-hidden="true">' + inner + '</svg>';

  // 一朵云：三个圆 + 一个圆角矩形拼成。dx / dy 是整体平移（给雨滴、闪电腾位置）
  const cloudShape = (fill, dx, dy) =>
    '<g transform="translate(' + dx + ' ' + dy + ')" fill="' + fill + '">' +
    '<circle cx="17" cy="27" r="7"/><circle cx="26" cy="21" r="9"/><circle cx="35" cy="27" r="6.5"/>' +
    '<rect x="17" y="27" width="18" height="7" rx="3"/></g>';

  // 太阳的 8 道光线：绕圆心每隔 45° 画一条短线
  function sunRays(cx, cy, r1, r2, w) {
    let lines = "";
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
      lines += '<line x1="' + (cx + c * r1).toFixed(1) + '" y1="' + (cy + s * r1).toFixed(1) +
               '" x2="' + (cx + c * r2).toFixed(1) + '" y2="' + (cy + s * r2).toFixed(1) + '"/>';
    }
    return '<g stroke="' + COL_SUN + '" stroke-width="' + w + '" stroke-linecap="round">' + lines + '</g>';
  }
  // 一组斜着的雨滴线：每个 [x, y1, y2]，线向左下倾斜 2.5
  const dropLines = (list, w) =>
    '<g stroke="' + COL_DROP + '" stroke-width="' + w + '" stroke-linecap="round">' +
    list.map((d) => '<line x1="' + d[0] + '" y1="' + d[1] + '" x2="' + (d[0] - 2.5) + '" y2="' + d[2] + '"/>').join("") + '</g>';

  const WX_ICONS = {
    sun:     svgWrap('<circle cx="24" cy="24" r="8.5" fill="' + COL_SUN + '"/>' + sunRays(24, 24, 13, 18, 2.8)),
    partly:  svgWrap('<circle cx="18" cy="17" r="6.5" fill="' + COL_SUN + '"/>' + sunRays(18, 17, 10, 13.5, 2.4) + cloudShape(COL_CLOUD, 3, 7)),
    cloud:   svgWrap(cloudShape(COL_CLOUD, -1, 1)),
    fog:     svgWrap('<g stroke="#dbe2f1" stroke-width="3" stroke-linecap="round"><line x1="9" y1="17" x2="37" y2="17"/><line x1="13" y1="24" x2="41" y2="24"/><line x1="9" y1="31" x2="33" y2="31"/></g>'),
    drizzle: svgWrap(cloudShape(COL_RAINCLOUD, -1, -4) + dropLines([[19, 33, 37.5], [29, 33, 37.5]], 2.6)),
    rain:    svgWrap(cloudShape(COL_RAINCLOUD, -1, -5) + dropLines([[17, 32, 40], [25, 32, 40], [33, 32, 40]], 2.8)),
    thunder: svgWrap(cloudShape(COL_STORMCLOUD, -1, -6) + '<polygon points="26.5,26 19,37.5 24.5,37.5 21.5,46 32,33 26,33 30,26" fill="' + COL_SUN + '"/>'),
    snow:    svgWrap(cloudShape(COL_RAINCLOUD, -1, -5) + '<g fill="#fff"><circle cx="16" cy="34" r="2.3"/><circle cx="25" cy="39" r="2.3"/><circle cx="34" cy="34" r="2.3"/></g>'),
  };

  // 天气代码 → { 文字, 图标名 }（WMO 编号，Open-Meteo 用的就是这一套）
  function wxInfo(code) {
    if (code === 0) return { text: "晴", icon: "sun" };
    if (code === 1) return { text: "少云", icon: "partly" };
    if (code === 2) return { text: "多云", icon: "partly" };
    if (code === 3) return { text: "阴", icon: "cloud" };
    if (code === 45 || code === 48) return { text: "雾", icon: "fog" };
    if (code >= 51 && code <= 57) return { text: "毛毛雨", icon: "drizzle" };
    if (code === 61 || code === 66) return { text: "小雨", icon: "rain" };
    if (code === 63) return { text: "中雨", icon: "rain" };
    if (code === 65 || code === 67) return { text: "大雨", icon: "rain" };
    if (code >= 71 && code <= 77) return { text: "下雪", icon: "snow" };
    if (code === 80) return { text: "小阵雨", icon: "rain" };
    if (code === 81) return { text: "阵雨", icon: "rain" };
    if (code === 82) return { text: "强阵雨", icon: "rain" };
    if (code === 85 || code === 86) return { text: "阵雪", icon: "snow" };
    if (code >= 95) return { text: "雷暴", icon: "thunder" };      // 95、96、99
    return { text: "未知", icon: "cloud" };
  }
  /* WX-PURE-END */

  const wxDaysEl = document.getElementById("wx-days");
  const wxNowEl  = document.getElementById("wx-now");
  const wxSubEl  = document.getElementById("wx-sub");

  const wxRound = (n) => Math.round(Number(n));

  // 今天 / 明天 / 周几（和"你电脑上的今天"比较）
  function wxDayLabel(date, todayStart) {
    const diff = Math.round((date - todayStart) / 86400000);
    if (diff === 0) return "今天";
    if (diff === 1) return "明天";
    return "周" + WEEK[date.getDay()];
  }

  // 加载中：先放 7 块会"呼吸"的占位
  function wxSkeleton() {
    wxDaysEl.innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const d = document.createElement("div");
      d.className = "wx-day skeleton";
      wxDaysEl.appendChild(d);
    }
  }

  // 失败：显示一句话 + 重试按钮
  function wxFail() {
    wxDaysEl.innerHTML = "";
    wxNowEl.innerHTML = "";
    wxSubEl.textContent = "未来 7 天预报";
    const box = document.createElement("div");
    box.className = "wx-fail";
    const msg = document.createElement("span");
    msg.textContent = "天气获取失败，请检查网络";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pill";
    btn.textContent = "重试";
    btn.addEventListener("click", () => { wxSkeleton(); loadWeather(true); });
    box.append(msg, btn);
    wxDaysEl.appendChild(box);
  }

  // 把数据画出来。data 是 Open-Meteo 返回的整个对象，stamp 是数据取回的时间
  function wxRender(data, stamp) {
    const d = data.daily;
    const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);

    // 把"每个字段一个数组"整理成"每天一条记录"；已经过去的日子（缓存过期时可能出现）丢掉
    const rows = d.time.map((t, i) => {
      const p = t.split("-").map(Number);               // "2026-10-16" → [2026, 10, 16]
      return {
        date: new Date(p[0], p[1] - 1, p[2]),
        m: p[1], day: p[2],
        code: d.weather_code[i],
        hi: d.temperature_2m_max[i],
        lo: d.temperature_2m_min[i],
        rain: d.precipitation_probability_max ? d.precipitation_probability_max[i] : null,
      };
    }).filter((r) => r.date >= todayStart);

    if (!rows.length) return wxFail();

    wxDaysEl.innerHTML = "";
    rows.forEach((r, i) => {
      const info = wxInfo(r.code);
      const card = document.createElement("div");
      card.className = "wx-day spot" + (i === 0 ? " today" : "");
      card.style.setProperty("--i", i);
      // 这里拼进去的只有：我们自己写的文字/图标，以及被 Math.round 转成数字的温度，所以用 innerHTML 是安全的
      card.innerHTML =
        '<div class="wx-label">' + wxDayLabel(r.date, todayStart) + '</div>' +
        '<div class="wx-date">' + r.m + '/' + r.day + '</div>' +
        '<div class="wx-icon">' + WX_ICONS[info.icon] + '</div>' +
        '<div class="wx-text">' + info.text + '</div>' +
        '<div class="wx-temp"><b>' + wxRound(r.hi) + '°</b><span>' + wxRound(r.lo) + '°</span></div>' +
        (r.rain !== null && r.rain !== undefined ? '<div class="wx-rain">降雨 ' + wxRound(r.rain) + '%</div>' : '');
      card.setAttribute("aria-label", wxDayLabel(r.date, todayStart) + "，" + info.text + "，最高 " + wxRound(r.hi) + " 度，最低 " + wxRound(r.lo) + " 度");
      wxDaysEl.appendChild(card);
    });

    // 右上角"现在"
    if (data.current && data.current.temperature_2m !== undefined) {
      const cur = wxInfo(data.current.weather_code);
      wxNowEl.innerHTML =
        WX_ICONS[cur.icon] +
        '<div><div class="wx-now-temp">' + wxRound(data.current.temperature_2m) + '°</div>' +
        '<div class="wx-now-text">现在 · ' + cur.text + '</div></div>';
    } else {
      wxNowEl.innerHTML = "";
    }

    const t = new Date(stamp);
    wxSubEl.textContent = "未来 " + rows.length + " 天预报 · 更新于 " + pad(t.getHours()) + ":" + pad(t.getMinutes());
  }

  function wxReadCache() {
    try { return JSON.parse(localStorage.getItem("wx-cache") || "null"); } catch (e) { return null; }
  }

  // 取天气：有新鲜缓存就直接用；否则联网请求；请求失败就退回旧缓存；再不行才显示"重试"
  async function loadWeather(force) {
    const cache = wxReadCache();
    if (!force && cache && Date.now() - cache.t < WX_TTL) { wxRender(cache.data, cache.t); return; }
    try {
      const res = await fetch(WX_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data.daily || !data.daily.time) throw new Error("数据格式不对");
      const now = Date.now();
      wxRender(data, now);
      try { localStorage.setItem("wx-cache", JSON.stringify({ t: now, data: data })); } catch (e) {}
    } catch (err) {
      if (cache && cache.data) wxRender(cache.data, cache.t);
      else wxFail();
    }
  }

  wxSkeleton();
  loadWeather(false);
  setInterval(() => loadWeather(false), 10 * 60 * 1000);   // 每 10 分钟检查一次（缓存没过期就不会真的联网）

  /* ============================================================
     N. 音乐播放器（本地音乐文件）
     流程：点播放 → 浏览器直接从 music 文件夹里加载这首歌 → 放完自动按模式切到下一首
           （列表循环 / 单曲循环 / 随机）。
     歌曲列表在上面的 SONGS，文件夹名在 MUSIC_DIR。不需要联网请求任何服务器。
     歌词解析（parseLyrics）的思路参考了开源项目 embedded-netease-music-player：
       Copyright 2020 Shengqiu Li
       https://github.com/dontpanic92/embedded-netease-music-player
       Licensed under the MIT license.
     ============================================================ */
  /* MUSIC-PURE-START */
  // 秒数 → "03:25"
  const mmss = (sec) => {
    if (!isFinite(sec) || sec < 0) sec = 0;
    return pad(Math.floor(sec / 60)) + ":" + pad(Math.floor(sec % 60));
  };

  // 把"文件夹 + 文件名"拼成网址（网站图标和音乐都用它）。
  // 每一段都做一次编码，所以文件名里有空格、中文、# ? 这些字符都不会出问题。
  function assetPath(dir, name) {
    return dir + String(name).split("/").map(encodeURIComponent).join("/");
  }

  // 把 SONGS 里的一项整理成统一的格式 { file, title, artist, cover, lyric }
  //   写成字符串 "歌手 - 歌名.mp3"：自动从文件名里拆出歌手和歌名
  //   写成对象 { file, title, artist, cover, lyric }：写了的用你写的，没写的自动补
  function songFromEntry(entry) {
    const o = typeof entry === "string" ? { file: entry } : (entry || {});
    const file = String(o.file || "");
    const base = file.replace(/^.*\//, "").replace(/\.[^.]+$/, "");   // 去掉前面的文件夹和后面的扩展名
    const sep = base.indexOf(" - ");
    return {
      file: file,
      title: o.title || (sep > 0 ? base.slice(sep + 3).trim() : base) || "未命名",
      artist: o.artist !== undefined ? o.artist : (sep > 0 ? base.slice(0, sep).trim() : ""),
      cover: o.cover || "",
      lyric: o.lyric || "",
    };
  }

  // 解析 LRC 歌词。一行长这样："[01:23.45]歌词内容"（有时一行有好几个时间标记）
  // 返回按时间从早到晚排好的数组：[{ seconds: 83.45, text: "歌词内容" }, ...]
  function parseLyrics(text) {
    const out = [];
    if (!text) return out;
    text.split("\n").forEach((line) => {
      const tags = line.match(/\[\d+:\d+(?:\.\d+)?\]/g);          // 这一行里所有的时间标记
      if (!tags) return;                                          // 没有时间标记的行（比如歌手信息）跳过
      const content = line.replace(/\[[^\]]*\]/g, "").trim();     // 去掉所有 [...] 剩下的就是歌词
      tags.forEach((tag) => {
        const m = /\[(\d+):(\d+(?:\.\d+)?)\]/.exec(tag);
        out.push({ seconds: parseInt(m[1], 10) * 60 + parseFloat(m[2]), text: content });
      });
    });
    out.sort((a, b) => a.seconds - b.seconds);
    return out;
  }

  function lyricAt(lines, t) {

    for (let i = 0; i < lines.length; i++) {

    }
    return cur;
  }

  // auto 是不是"放完了自动切"（true）还是"你手动点的"（false），rnd 随机数函数
  //   列表循环：按顺序，最后一首接第一首
  //   单曲循环：自动切时还是这一首；你手动点下一首/上一首时，照常换歌
  //   随机播放：从"除了当前这首"里随机挑一首
  function nextIndex(mode, i, n, dir, auto, rnd) {
    if (n <= 1) return 0;
    if (mode === "one" && auto) return i;
    if (mode === "shuffle") {

      return j >= i ? j + 1 : j;
    }
    return (i + dir + n) % n;
  }
  /* MUSIC-PURE-END */

  const musicEl    = document.getElementById("music");
  const musicBtn   = document.getElementById("music-btn");
  const mCoverEl   = document.getElementById("music-cover");
  const mTitleEl   = document.getElementById("music-title");

  const mLyricEl   = document.getElementById("music-lyric");
  const mBarEl     = document.getElementById("music-bar");
  const mFillEl    = document.getElementById("music-fill");
  const mCurEl     = document.getElementById("music-cur");
  const mDurEl     = document.getElementById("music-dur");
  const mModeBtn   = document.getElementById("music-mode");
  const mPrevBtn   = document.getElementById("music-prev");
  const mPlayBtn   = document.getElementById("music-play");
  const mNextBtn   = document.getElementById("music-next");
  const mListEl    = document.getElementById("music-list");

  const mSongs = SONGS.map(songFromEntry).filter((song) => song.file);   // 整理好的歌曲列表
  const MODES = [

    { key: "one",     label: "单曲循环" },

  let mIndex = -1;                 // 现在是列表里的第几首（-1 = 还没开始）

  let mFails = 0;                  // 连续放不了几首了

  function showInfo(title, artist) {

    mArtistEl.textContent = artist;

    }

    mCoverEl.onerror = () => { mCoverEl.style.display = "none"; };      // 封面文件找不到就算了，显示默认的渐变底
    mCoverEl.src = url;
  }

  // 歌曲列表：每首一行（歌名太长会换行显示完整，列表放不下时整体上下滑动）；点哪首播哪首；现在这首高亮
  function renderList() {
    mListEl.textContent = "";
    if (!mSongs.length) {
      const tip = document.createElement("div");
      tip.className = "music-empty";
      tip.textContent = "还没有歌。把音乐文件放进 music 文件夹，再在代码里的 SONGS 列表里写上文件名。";
      mListEl.appendChild(tip);
      return;
    }
    mSongs.forEach((song, i) => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "music-row" + (i === mIndex ? " current" : "");
      row.dataset.i = String(i);
      row.textContent = (i + 1) + ". " + song.title + (song.artist ? " · " + song.artist : "");
      mListEl.appendChild(row);
    });
  }

    Array.prototype.forEach.call(mListEl.children, (row, i) => {

    });
  }

    const row = e.target.closest(".music-row");
    if (row) playTrack(Number(row.dataset.i));
  });
  renderList();

  // 放不了（文件名写错 / 文件还没上传 / 格式浏览器不支持）：显示原因，过 1.5 秒自动跳到下一首；
  // 如果整个列表连着都放不了，就停下来，不要无限循环
  function trackFailed(token, msg) {
    if (token !== mToken) return;
    mFails++;
    mArtistEl.textContent = msg;
    if (mFails >= mSongs.length) {
      mFails = 0;
      mArtistEl.textContent = "列表里的歌都放不了：请检查文件名、文件夹和格式";
      return;
    }
    mFailTimer = setTimeout(() => { if (token === mToken) playTrack(mIndex + 1); }, 1500);
  }

  // 播放列表里的第 i 首
  function playTrack(i) {
    if (!mSongs.length) return;
    clearTimeout(mFailTimer);
    mIndex = ((i % mSongs.length) + mSongs.length) % mSongs.length;
    const song = mSongs[mIndex];
    const token = ++mToken;
    mAudio.pause();
    mLines = [];
    mLyricEl.textContent = "";
    mFillEl.style.width = "0%"; mCurEl.textContent = "00:00"; mDurEl.textContent = "00:00";
    showInfo(song.title, song.artist);
    setCover(song.cover ? assetPath(MUSIC_DIR, song.cover) : "");
    markCurrent();

    // 歌词（可选）：读取同一个文件夹里的 .lrc 文本文件。读不到就算了，只是没有歌词显示
    if (song.lyric) {
      fetch(assetPath(MUSIC_DIR, song.lyric))
        .then((r) => (r.ok ? r.text() : ""))
        .then((text) => { if (token === mToken) mLines = parseLyrics(text); })
        .catch(() => {});
    }

    mAudio.src = assetPath(MUSIC_DIR, song.file);
    mAudio.play().catch((err) => {
      if (token !== mToken) return;
      // 浏览器拦了自动播放：提示你点一下 ▶（文件打不开的情况由下面的 error 事件处理）
      if (err && err.name === "NotAllowedError") mArtistEl.textContent = "点一下 ▶ 开始播放";

  }

  // ----- 播放器自己的事件 -----
  function syncPlayState() {

    musicBtn.classList.toggle("playing", playing);      // 侧边栏的音符按钮会"呼吸"

  }

  mAudio.addEventListener("pause", syncPlayState);
  mAudio.addEventListener("playing", () => { mFails = 0; });      // 真的放出声音了，失败计数清零
  mAudio.addEventListener("timeupdate", () => {
    const t = mAudio.currentTime, dur = mAudio.duration;
    mCurEl.textContent = mmss(t);
    mDurEl.textContent = mmss(dur);
    mFillEl.style.width = (isFinite(dur) && dur > 0 ? (t / dur) * 100 : 0) + "%";
    const line = lyricAt(mLines, t);
    if (mLyricEl.textContent !== line) mLyricEl.textContent = line;
  });
  mAudio.addEventListener("ended", () => {
    const n = nextIndex(MODES[mModeIdx].key, mIndex, mSongs.length, 1, true, Math.random);
    if (n === mIndex) { mAudio.currentTime = 0; mAudio.play().catch(() => {}); }   // 单曲循环：直接从头再放
    else playTrack(n);

  });

  // ----- 按钮 -----
  const mStartIndex = () => (MODES[mModeIdx].key === "shuffle" ? Math.floor(Math.random() * mSongs.length) : 0);
  mPlayBtn.addEventListener("click", () => {
    if (!mAudio.getAttribute("src")) { playTrack(mIndex === -1 ? mStartIndex() : mIndex); return; }   // 还没开始，或者上一首没放成功
    if (mAudio.paused) mAudio.play().catch(() => {}); else mAudio.pause();
  });
  mPrevBtn.addEventListener("click", () => {
    playTrack(mIndex === -1 ? mStartIndex() : nextIndex(MODES[mModeIdx].key, mIndex, mSongs.length, -1, false, Math.random));
  });
  mNextBtn.addEventListener("click", () => {
    playTrack(mIndex === -1 ? mStartIndex() : nextIndex(MODES[mModeIdx].key, mIndex, mSongs.length, 1, false, Math.random));
  });
  mModeBtn.addEventListener("click", () => {
    mModeIdx = (mModeIdx + 1) % MODES.length;
    mModeBtn.textContent = MODES[mModeIdx].label;
  });
  // 点进度条：跳到对应位置
  mBarEl.addEventListener("click", (e) => {
    const dur = mAudio.duration;
    if (!isFinite(dur) || dur <= 0) return;
    const r = mBarEl.getBoundingClientRect();
    mAudio.currentTime = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * dur;
  });

  if (typeof navigator !== "undefined" && navigator.mediaSession) {

      navigator.mediaSession.setActionHandler("play", () => mPlayBtn.click());
      navigator.mediaSession.setActionHandler("pause", () => mPlayBtn.click());

      navigator.mediaSession.setActionHandler("nexttrack", () => mNextBtn.click());
    } catch (e) {}
  }

  // ----- 窗口的打开 / 关闭 / 拖动 -----
  function openMusic() { musicEl.classList.add("open"); bringToFront(musicEl); }
  function closeMusic() {
    if (!musicEl.classList.contains("open")) return;
    aimAt(musicEl, musicBtn);                // 朝侧边栏的音符按钮收进去（音乐不会停）
    musicEl.classList.remove("open");
  }
  musicBtn.addEventListener("click", () => {
    musicEl.classList.contains("open") ? closeMusic() : openMusic();
  });
  document.getElementById("music-close").addEventListener("click", closeMusic);
  // 在窗口空白处按住可以拖；点按钮、进度条、歌曲列表时不触发拖动
  const musicDrag = makeDraggable(musicEl, musicEl, "button, .music-bar, .music-list");
  window.addEventListener("resize", () => musicDrag.clamp());

  /* ============================================================
     O. 桌宠（清爽模式侧边栏里的最后一个按钮）
     - 点侧边栏的猫爪按钮：桌宠从屏幕右下角弹出来；再点一次：收回去。这是唯一能收起它的办法。
       （退出清爽模式时它也会收起）
     - 点桌宠：做一次"Q 弹"（在垂直方向快速压扁一点，再弹回来）。
     - 每次点击都有固定 1/5 的概率冒出对话框，在头顶停 2 秒后消失。
     - 连续点击 20 下：触发彩蛋。桌宠一直 Q 弹，不理会别的点击，同时播放一首歌，

     ============================================================ */
  /* PET-PURE-START */
  // "连续点击"的计数：和上一次点击间隔不超过 gap 毫秒，就在原来的基础上 +1，否则重新从 1 开始数
  function nextCombo(count, lastTime, now, gap) {

  const PET_BOUNCE = [

    { transform: "scaleY(1.06)", offset: 0.62 },

  const PET_EGG_OPTS = { duration: 460, iterations: Infinity, easing: "ease-out" };    // 彩蛋：无限循环
  /* PET-PURE-END */

  /* PET-START */
  const petEl     = document.getElementById("pet");
  const petImg    = document.getElementById("pet-img");
  const petBubble = document.getElementById("pet-bubble");
  const petSayEl  = document.getElementById("pet-say");
  const petBtn    = document.getElementById("pet-btn");
  const petDs     = document.getElementById("pet-ds");        // 第二个桌宠（DeepSeek）的外框
  const petDsImg  = document.getElementById("pet-ds-img");

  let petOpen = false;
  let petImgSet = false;          // 图片地址是不是已经设置过（第一次召唤时才设置，之后不重复加载）
  let petClicks = 0;              // 当前连续点了几下
  let petLast = 0;                // 上一次点击的时间
  let petEgg = false;             // 彩蛋进行中？
  let petAnim = null;             // 正在播放的 Q 弹动画
  let petBubbleTimer = 0;
  let petEggAudio = null;         // 彩蛋的歌

  function dsBounce() {

  function petSay(text) {

  function startEgg() {

    dsShow(true);                                              // DeepSeek 从屏幕下方升起来
    dsBounce();                                                // DeepSeek 用同样的节奏 Q 弹（和上一行在同一瞬间开始，所以两个同步）
    lightsStart();                                             // 聚光灯从屏幕上方随机的位置冒出来，向下扫射
    // 音乐播放器如果正在放歌，先暂停，彩蛋结束后再接着放（两首歌同时响会乱）
    petResumeMusic = !mAudio.paused;
    if (petResumeMusic) mAudio.pause();
    petEggAudio = new Audio(assetPath(MUSIC_DIR, PET_EGG_SONG));
    petEggAudio.addEventListener("ended", () => endEgg());     // 歌放完了 → 彩蛋结束
    petEggAudio.addEventListener("error", () => {              // 歌曲文件找不到 / 打不开 → 提示一下，结束彩蛋

      petSay("找不到彩蛋的歌：请检查 PET_EGG_SONG");
    });
    petEggAudio.play().catch(() => {});                        // 失败的情况由上面的 error 事件处理
  }
  // fast 为 true 时（桌宠被收起），聚光灯熄灭得更快；歌自然放完时，灯光会慢慢淡出
  function endEgg(fast) {
    if (!petEgg) return;
    petEgg = false;
    dsShow(false);                                             // DeepSeek 沉回屏幕下方
    if (petDsAnim) { petDsAnim.cancel(); petDsAnim = null; }
    lightsStop(!!fast);                                        // 聚光灯渐渐熄灭
    if (petAnim) { petAnim.cancel(); petAnim = null; }
    if (petEggAudio) { petEggAudio.pause(); petEggAudio = null; }
    petClicks = 0; petLast = 0;
    if (petResumeMusic) { petResumeMusic = false; mAudio.play().catch(() => {}); }
  }

  // ----- 召唤 / 收起 -----
  function openPet() {
    if (!petImgSet) { petImg.src = assetPath(ICON_DIR, PET_IMG); petImgSet = true; }
    // 提前把 DeepSeek 的图片也加载好，这样彩蛋触发的那一刻它能立刻升起来，不用等图片下载
    if (!petDsSet) { petDsImg.src = assetPath(ICON_DIR, PET2_IMG); petDsSet = true; }
    petOpen = true;
    petEl.classList.add("open");
    petEl.setAttribute("aria-hidden", "false");
    petBtn.setAttribute("aria-pressed", "true");              // 按钮变成白色实心，表示桌宠在场
  }
  function closePet() {
    if (!petOpen) return;
    petOpen = false;
    petEl.classList.remove("open");
    petEl.setAttribute("aria-hidden", "true");
    petBtn.setAttribute("aria-pressed", "false");
    endEgg(true);                                              // 彩蛋进行中收起：歌停、动画停、球快速收走
    clearTimeout(petBubbleTimer);
    petBubble.classList.remove("show");
    if (petAnim) { petAnim.cancel(); petAnim = null; }
    petClicks = 0; petLast = 0;
  }
  petBtn.addEventListener("click", () => { petOpen ? closePet() : openPet(); });
  // 图片找不到（还没上传到 icons 文件夹）：悄悄收回去，按钮恢复原样
  petImg.addEventListener("error", () => { petImgSet = false; closePet(); });
  // DeepSeek 的图片找不到：彩蛋里不出现它，其他（Q 弹、灯光、歌）照常
  petDsImg.addEventListener("error", () => { petDsOk = false; petDsSet = false; });   // petDsSet 复位：下次召唤桌宠时会再试一次
  petDsImg.addEventListener("load", () => { petDsOk = true; });                       // 之后只要成功加载过（比如你把图片补传上去了），就恢复可用，不用刷新页面
  /* PET-END */

  /* ============================================================
     P. 聚光灯（彩蛋时出现）
     5~6 束彩色的灯光（基础 5 束，换班的瞬间会多出 1 束），从屏幕上方边缘的随机位置射出来，一边向下扫射、左右摆动，一边慢慢变换颜色，
     像舞台上的聚光灯。灯光落在屏幕底边的地方，还会留下一圈柔和的光斑。
     每一束灯有自己的"寿命"（4~7 秒）：淡入 → 扫射 → 淡出。它开始淡出的时候，会有一束新灯在另一个随机位置
     同时开始淡入，所以屏幕上始终有 5~6 束灯在扫，不会出现空档；开头几束是一束接一束冒出来的，不是同时亮起。
     全部画在一张铺满屏幕的 <canvas>（画布）上，每一帧重画一次。
     灯的数量在上面的配置区（SPOT_COUNT）。
     ============================================================ */
  /* LIGHTS-PURE-START */
  const clamp01 = (x) => Math.min(Math.max(x, 0), 1);
  const SPOT_FADE_IN = 450, SPOT_FADE_OUT = 550;      // 一束灯淡入、淡出各花多久（毫秒）

  // 一束聚光灯"出生"：随机决定它的位置、摆动方式、颜色和寿命。
  // w 是屏幕宽度，born 是出生的时刻（毫秒），rnd 是随机数函数（0~1）。
  function spotSpawn(w, born, rnd) {
    return {
      x: w * (0.06 + 0.88 * rnd()),                   // 灯在屏幕上边缘的位置（离左右两边留一点空）
      base: Math.PI / 2 + (rnd() - 0.5) * 0.5,        // 摆动的中心方向：大致朝正下方（π/2），左右各偏一点
      amp: 0.35 + 0.45 * rnd(),                       // 左右扫动的幅度（弧度）
      speed: 0.6 + 0.9 * rnd(),                       // 扫动的快慢
      phase: rnd() * Math.PI * 2,                     // 扫动的起点（让每束灯步调不一样）
      half: 0.055 + 0.05 * rnd(),                     // 光束宽度的一半（弧度）
      hue: rnd() * 360,                               // 起始颜色
      hueSpeed: (40 + 60 * rnd()) * (rnd() < 0.5 ? -1 : 1),   // 颜色变化的快慢和方向
      born: born,
      life: 4000 + 3000 * rnd(),                      // 寿命 4~7 秒
    };
  }

  // 这束灯在 now 时刻的状态：
  //   angle 现在指向哪个方向（弧度，π/2 = 正下方；摆动范围保证永远朝下，不会射向天上）
  //   hue   现在的颜色
  //   alpha 现在的亮度 0~1（出生后淡入，快到寿命时淡出；还没出生时是 0）
  function spotState(sp, now) {
    const age = now - sp.born;
    const t = Math.max(age, 0) / 1000;
    return {
      angle: sp.base + sp.amp * Math.sin(sp.phase + t * sp.speed),
      hue: (((sp.hue + t * sp.hueSpeed) % 360) + 360) % 360,
      alpha: Math.min(clamp01(age / SPOT_FADE_IN), clamp01((sp.life - age) / SPOT_FADE_OUT)),
    };
  }

  // 更新灯的名单（每一帧调用一次）：
  //   · 一束灯开始淡出的那一刻，就让一束新灯在另一个随机位置同时开始淡入——
  //     旧灯淡出和新灯淡入重叠在一起，所以屏幕上不会出现"灯突然少了"的空档，始终是 5~6 束够亮的灯（过渡的瞬间会短暂多出一束淡淡的）；
  //   · 完全熄灭的灯从名单里删掉。
  //   · 如果页面在后台停了很久，回来时一堆灯同时到期，也会各自补上一束新的。
  function spotsTick(spots, now, w, rnd) {
    const out = [];
    spots.forEach((sp) => {
      const age = now - sp.born;
      if (age >= sp.life) {                                   // 已经熄灭：删掉（如果还没找人接替，现在补上）
        if (!sp.next) out.push(spotSpawn(w, now, rnd));
        return;
      }
      if (!sp.next && age >= sp.life - SPOT_FADE_OUT) {       // 开始淡出：让一束新灯同时淡入
        sp.next = true;
        out.push(spotSpawn(w, now, rnd));
      }
      out.push(sp);
    });
    return out;
  }
  /* LIGHTS-PURE-END */

  /* LIGHTS-START */
  const lightsCv = document.getElementById("lights");
  const lightsCtx = lightsCv.getContext ? lightsCv.getContext("2d") : null;
  const lights = { running: false, leaving: false, raf: 0, spots: [], tLeave: 0, leaveMs: 1000 };

  // 让画布的像素尺寸 = 屏幕尺寸 × 屏幕的像素密度
  function lightsResize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    lightsCv.width = Math.round(window.innerWidth * dpr);
    lightsCv.height = Math.round(window.innerHeight * dpr);
    lightsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);     // 之后画图都按"CSS 像素"的坐标来，不用管 dpr
  }
  window.addEventListener("resize", () => { if (lights.running) lightsResize(); });

  function lightsStart() {
    if (!lightsCtx) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;                                // 系统开了"减少动画"：不放灯光
    cancelAnimationFrame(lights.raf);
    const now = performance.now();
    lights.spots = [];
    for (let i = 0; i < SPOT_COUNT; i++) {
      // 每束灯的出生时间错开 0~1.2 秒，所以是一束接一束随机冒出来
      lights.spots.push(spotSpawn(window.innerWidth, now + Math.random() * 1200, Math.random));
    }
    lights.running = true;
    lights.leaving = false;
    lightsCv.classList.add("on");
    lightsResize();
    lights.raf = requestAnimationFrame(lightsFrame);
  }

  // 结束：不是一下子消失，而是所有灯光一起渐渐熄灭（fast 时更快），熄完了才真正隐藏画布
  function lightsStop(fast) {
    if (!lights.running || lights.leaving) return;
    lights.leaving = true;
    lights.tLeave = performance.now();
    lights.leaveMs = fast ? 400 : 1100;
  }
  function lightsHide() {
    lights.running = false;
    lights.leaving = false;
    cancelAnimationFrame(lights.raf);
    lightsCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    lightsCv.classList.remove("on");
  }

  // 每一帧：到了寿命的灯换一束新的，然后把所有灯画出来
  function lightsFrame() {
    if (!lights.running) return;
    const now = performance.now();
    const w = window.innerWidth, h = window.innerHeight;
    let fade = 1;                                      // 整体亮度（收场时从 1 降到 0）
    if (lights.leaving) {
      const p = clamp01((now - lights.tLeave) / lights.leaveMs);
      fade = 1 - p;
      if (p >= 1) { lightsHide(); return; }
    } else {
      lights.spots = spotsTick(lights.spots, now, w, Math.random);   // 快熄灭的灯：叫一束新灯在别处同时淡入；熄灭了的删掉
    }
    drawLights(lightsCtx, w, h, now, fade);
    lights.raf = requestAnimationFrame(lightsFrame);
  }

  function drawLights(ctx, w, h, now, fade) {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";          // "叠加"混合：几束光重叠的地方更亮、颜色会混在一起，才像真的灯光
    const y0 = -8;                                     // 灯的位置：屏幕上边缘稍微靠外一点点
    lights.spots.forEach((sp) => {
      const st = spotState(sp, now);
      const a = st.alpha * fade;
      if (a <= 0.01) return;                           // 还没出生 / 已经淡没了
      const sinA = Math.max(Math.sin(st.angle), 0.2);
      const cosA = Math.cos(st.angle);
      const len = (h - y0) / sinA * 1.25;              // 光束长度：射到屏幕底边还要再多一点，免得在屏幕里看到光束的"断口"
      const color = (alpha) => "hsla(" + st.hue + ",100%,68%," + alpha + ")";

      // ① 光束：从灯射出去的一个细长三角形，离灯越远越淡
      const g = ctx.createRadialGradient(sp.x, y0, 0, sp.x, y0, len);
      g.addColorStop(0, color(0.6 * a));
      g.addColorStop(0.55, color(0.3 * a));
      g.addColorStop(1, color(0.1 * a));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sp.x, y0);
      ctx.lineTo(sp.x + Math.cos(st.angle - sp.half) * len, y0 + Math.sin(st.angle - sp.half) * len);
      ctx.lineTo(sp.x + Math.cos(st.angle + sp.half) * len, y0 + Math.sin(st.angle + sp.half) * len);
      ctx.closePath();
      ctx.fill();

      // ② 光束落在屏幕底边的光斑：压扁的椭圆（像灯光打在地板上）
      const hit = (h - y0) / sinA;
      const hx = sp.x + cosA * hit;
      ctx.save();
      ctx.translate(hx, h);
      ctx.scale(1, 0.35);
      const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
      pool.addColorStop(0, color(0.5 * a));
      pool.addColorStop(1, color(0));
      ctx.fillStyle = pool;
      ctx.beginPath();
      ctx.arc(0, 0, 130, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ③ 灯头：屏幕上边缘一小团发光的光晕
      const lamp = ctx.createRadialGradient(sp.x, 0, 0, sp.x, 0, 34);
      lamp.addColorStop(0, color(0.8 * a));
      lamp.addColorStop(1, color(0));
      ctx.fillStyle = lamp;
      ctx.beginPath();
      ctx.arc(sp.x, 0, 34, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = "source-over";      // 画完灯光，恢复成普通的"盖上去"混合
  }
  /* LIGHTS-END */

  /* ---------- G. 入场动画 ---------- */
  // 等页面画好后给 body 加 "ready"，CSS 里的入场动画就开始播放
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
  // 播完后去掉 .reveal，免得它的过渡设置影响之后的悬停/聚焦动画
  setTimeout(() => document.querySelectorAll(".reveal").forEach((el) => el.classList.remove("reveal")), 2400);
</script>
</body>
</html>
